<title id="title">Instantánea 7: Pagos a Justificar vs. Anticipos de Caja Fija (Arts. 60 y 61 Ley 1/2015 — Exámenes GVA)</title>
<desc id="desc">Infografía de repaso del tema 18, basada en Hacienda Pública, Presupuestos y Contratación (Ley 1/2015 y Ley 9/2017).</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#b65a70">TEMA 18 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#512b35">Pagos a Justificar vs. Anticipos de Caja Fija (Arts. 60 y 61 Ley 1/2015 — Exámenes GVA)</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Hacienda Pública, Presupuestos y Contratación (Ley 1/2015 y Ley 9/2017)</text>
<rect x="28" y="148" width="944" height="376" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="158" width="928" height="92" rx="10" fill="#fbf0f2" /><rect x="36" y="158" width="5" height="92" rx="2.5" fill="#b65a70" /><rect x="36" y="251" width="928" height="92" rx="10" fill="#f5e2e7" /><rect x="36" y="251" width="5" height="92" rx="2.5" fill="#b65a70" /><rect x="36" y="344" width="928" height="92" rx="10" fill="#fbf0f2" /><rect x="36" y="344" width="5" height="92" rx="2.5" fill="#b65a70" /><rect x="36" y="437" width="928" height="61" rx="10" fill="#f5e2e7" /><rect x="36" y="437" width="5" height="61" rx="2.5" fill="#b65a70" /><text x="48" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">Característica   •   Pagos a Justificar (Art. </tspan><tspan fill="#b65a70" font-weight="700">60</tspan><tspan fill="#18352a">)   •   Anticipos de Caja Fija (Art. </tspan><tspan fill="#b65a70" font-weight="700">61</tspan><tspan fill="#18352a">)</tspan></text>
<text x="48" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a">¿Cuándo se usan?   •   Cuando excepcionalmente no puede aportarse la documentación</text>
<text x="48" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a">justificativa de las obligaciones en el momento de expedir la orden de pago.   •</text>
<text x="48" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a">Provisiones de fondos de carácter extrapresupuestario y permanente para atender gastos</text>
<text x="48" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a">periódicos o repetitivos (dietas, locomoción, material no inventariable, conservación).</text>
<text x="48" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a">Límite cuantitativo   •   El crédito presupuestario asignado a ese gasto concreto.   •</text>
<text x="48" y="364" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">No podrá exceder del </tspan><tspan fill="#b65a70" font-weight="700">7%</tspan><tspan fill="#18352a"> del total de créditos del Capítulo </tspan><tspan fill="#b65a70" font-weight="700">2</tspan><tspan fill="#18352a"> (gastos corrientes en</tspan></text>
<text x="48" y="395" font-family="Arial,sans-serif" font-size="17" fill="#18352a">bienes y servicios) del presupuesto vigente en cada Conselleria.</text>
<text x="48" y="426" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">Plazo para rendir cuentas   •   Con carácter general, en el plazo de </tspan><tspan fill="#b65a70" font-weight="700">3 meses</tspan><tspan fill="#18352a"> (y siempre</tspan></text>
<text x="48" y="457" font-family="Arial,sans-serif" font-size="17" fill="#18352a">antes de finalizar el ejercicio presupuestario).   •   A medida que se necesite</text>
<text x="48" y="488" font-family="Arial,sans-serif" font-size="17" fill="#18352a">reposición de fondos y, necesariamente, al cierre del ejercicio presupuestario.</text>
<text x="42" y="566" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
