<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 713" role="img" aria-labelledby="title desc">
<title id="title">Instantánea 7: El "Juego de las Mayorías" (Especial C2)</title>
<desc id="desc">Infografía de repaso del tema 4, basada en Estatuto de Autonomía de la Comunitat Valenciana (LO 5/1982).</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#c47a32">TEMA 04 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#563915">El "Juego de las Mayorías" (Especial C2)</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Estatuto de Autonomía de la Comunitat Valenciana (LO 5/1982)</text>
<rect x="28" y="148" width="944" height="500" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="468" width="928" height="92" rx="10" fill="#fbf3e8" /><rect x="36" y="468" width="5" height="92" rx="2.5" fill="#c47a32" /><circle cx="55" cy="171" r="5" fill="#4d9670" />
<text x="73" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Mayoría SIMPLE:</text>
<circle cx="55" cy="202" r="5" fill="#4d9670" />
<text x="73" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• 2ª votación de investidura del President (48h después).</text>
<circle cx="55" cy="233" r="5" fill="#4d9670" />
<text x="73" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Cuestión de confianza.</text>
<circle cx="55" cy="264" r="5" fill="#4d9670" />
<text x="73" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Mayoría ABSOLUTA:</text>
<circle cx="55" cy="295" r="5" fill="#4d9670" />
<text x="73" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• 1ª votación de investidura del President.</text>
<circle cx="55" cy="326" r="5" fill="#4d9670" />
<text x="73" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Moción de censura.</text>
<circle cx="55" cy="357" r="5" fill="#4d9670" />
<text x="73" y="364" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Leyes de desarrollo básico del Estatuto (Art. 44.4).</text>
<circle cx="55" cy="388" r="5" fill="#4d9670" />
<text x="73" y="395" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Reforma del Estatuto solo si es para ampliar competencias (Art. 81.3).</text>
<circle cx="55" cy="419" r="5" fill="#4d9670" />
<text x="73" y="426" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Mayoría de 3/5:</text>
<circle cx="55" cy="450" r="5" fill="#4d9670" />
<text x="73" y="457" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Elección de los miembros de las 5 instituciones estatutarias (Síndic, Sindicatura,</text>
<text x="48" y="488" font-family="Arial,sans-serif" font-size="17" fill="#18352a">CVC, AVL, CES).</text>
<circle cx="55" cy="512" r="5" fill="#4d9670" />
<text x="73" y="519" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Elección del Consell Jurídic Consultiu (CJC) -&gt; Ojo, va en el Título III Cap. VI,</text>
<text x="48" y="550" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">fuera del "pack" de los </tspan><tspan fill="#c47a32" font-weight="700">5</tspan><tspan fill="#18352a"> del Cap. VII, pero también requiere </tspan><tspan fill="#c47a32" font-weight="700">3</tspan><tspan fill="#18352a">/</tspan><tspan fill="#c47a32" font-weight="700">5</tspan><tspan fill="#18352a">.</tspan></text>
<circle cx="55" cy="574" r="5" fill="#4d9670" />
<text x="73" y="581" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Mayoría de 2/3:</text>
<circle cx="55" cy="605" r="5" fill="#4d9670" />
<text x="73" y="612" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Reforma general del Estatuto de Autonomía (Art. 81.2).</text>
<text x="42" y="690" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
