<title id="title">Instantánea 2: El Ciclo Presupuestario</title>
<desc id="desc">Infografía de repaso del tema 17, basada en Hacienda Pública, Presupuestos y Contratación (Ley 1/2015 y Ley 9/2017).</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#258b8b">TEMA 17 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#164847">El Ciclo Presupuestario</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Hacienda Pública, Presupuestos y Contratación (Ley 1/2015 y Ley 9/2017)</text>
<rect x="28" y="148" width="944" height="221" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="158" width="928" height="92" rx="10" fill="#e9f5f3" /><rect x="36" y="158" width="5" height="92" rx="2.5" fill="#258b8b" /><rect x="36" y="251" width="928" height="92" rx="10" fill="#d9eeeb" /><rect x="36" y="251" width="5" height="92" rx="2.5" fill="#258b8b" /><text x="48" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#258b8b" font-weight="700">1</tspan><tspan fill="#18352a">. Elaboración: Conselleria competente en Hacienda.</tspan></text>
<text x="48" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#258b8b" font-weight="700">2</tspan><tspan fill="#18352a">. Aprobación Proyecto de Ley: El Consell, remitiéndolo a Les Corts antes del </tspan><tspan fill="#258b8b" font-weight="700">1</tspan><tspan fill="#18352a"> de</tspan></text>
<text x="48" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">noviembre (¡Ojo! En el Estado es antes del </tspan><tspan fill="#258b8b" font-weight="700">1</tspan><tspan fill="#18352a"> de octubre).</tspan></text>
<text x="48" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#258b8b" font-weight="700">3</tspan><tspan fill="#18352a">. Aprobación definitiva: Les Corts.</tspan></text>
<text x="48" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#258b8b" font-weight="700">4</tspan><tspan fill="#18352a">. Prórroga automática: Si no se aprueba antes del </tspan><tspan fill="#258b8b" font-weight="700">1</tspan><tspan fill="#18352a"> de enero, se prorroga</tspan></text>
<text x="48" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a">automáticamente el presupuesto inicial del ejercicio anterior.</text>
<text x="42" y="411" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
