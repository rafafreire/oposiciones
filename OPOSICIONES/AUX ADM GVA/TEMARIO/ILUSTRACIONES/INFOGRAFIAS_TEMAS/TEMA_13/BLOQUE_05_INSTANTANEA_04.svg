<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 465" role="img" aria-labelledby="title desc">
<title id="title">Instantánea 4: Abstención y Recusación (Arts. 23 y 24)</title>
<desc id="desc">Infografía de repaso del tema 13, basada en Régimen Jurídico del Sector Público (Ley 40/2015, de 1 de octubre).</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#386f8f">TEMA 13 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#143b52">Abstención y Recusación (Arts. 23 y 24)</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Régimen Jurídico del Sector Público (Ley 40/2015, de 1 de octubre)</text>
<rect x="28" y="148" width="944" height="252" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="189" width="928" height="185" rx="10" fill="#eaf3f8" /><rect x="36" y="189" width="5" height="185" rx="2.5" fill="#386f8f" /><circle cx="55" cy="171" r="5" fill="#4d9670" />
<text x="73" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Abstención: Voluntaria por el propio empleado público comunicándolo a su superior</text>
<text x="48" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a">inmediato.</text>
<circle cx="55" cy="233" r="5" fill="#4d9670" />
<text x="73" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Recusación: La promueven los interesados por escrito en cualquier momento.</text>
<circle cx="55" cy="264" r="5" fill="#4d9670" />
<text x="73" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Trámite: Al día siguiente, el recusado manifiesta a su superior si se da o no la</text>
<text x="48" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">causa. Si la niega, el superior resuelve en el plazo de </tspan><tspan fill="#386f8f" font-weight="700">3 días</tspan><tspan fill="#18352a">.</tspan></text>
<circle cx="55" cy="326" r="5" fill="#4d9670" />
<text x="73" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Trampa clásica: Contra las resoluciones en materia de recusación NO cabrá recurso (se</text>
<text x="48" y="364" font-family="Arial,sans-serif" font-size="17" fill="#18352a">alega al recurrir la resolución final).</text>
<text x="42" y="442" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
<g aria-hidden="true"><circle cx="918" cy="80" r="34" fill="#ffffff" opacity="0.92" /><circle cx="918" cy="80" r="29" fill="#386f8f" opacity="0.16" /><path d="M891 73 L918 55 L945 73 Z" fill="#fff" stroke="#386f8f" stroke-width="3" stroke-linejoin="round" /><path d="M895 101 H941 M900 96 V77 M910 96 V77 M926 96 V77 M936 96 V77 M893 74 H943" fill="none" stroke="#386f8f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /></g></svg>