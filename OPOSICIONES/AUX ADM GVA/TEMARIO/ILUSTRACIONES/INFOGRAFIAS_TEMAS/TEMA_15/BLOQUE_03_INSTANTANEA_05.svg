<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Instantánea 5: Situaciones Administrativas (Art. 122)</title>
<desc id="desc">Infografía de repaso del tema 15, basada en Ley de la Función Pública Valenciana (Ley 4/2021, de 16 de abril).</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#7d63a8">TEMA 15 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#3c2f57">Situaciones Administrativas (Art. 122)</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Ley de la Función Pública Valenciana (Ley 4/2021, de 16 de abril)</text>
<rect x="28" y="148" width="944" height="407" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="220" width="928" height="154" rx="10" fill="#f3eff8" /><rect x="36" y="220" width="5" height="154" rx="2.5" fill="#7d63a8" /><rect x="36" y="375" width="928" height="123" rx="10" fill="#eae2f4" /><rect x="36" y="375" width="5" height="123" rx="2.5" fill="#7d63a8" /><circle cx="55" cy="171" r="5" fill="#4d9670" />
<text x="73" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Servicio activo: Estás trabajando en tu puesto normal.</text>
<circle cx="55" cy="202" r="5" fill="#4d9670" />
<text x="73" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Servicios especiales: Te nombran alto cargo, Diputado, miembro del Consell, asesor de</text>
<text x="48" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a">gabinete (eventual), etc. (Computa a efectos de trienios, ascensos y reserva de plaza).</text>
<circle cx="55" cy="264" r="5" fill="#4d9670" />
<text x="73" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Servicio en otras Administraciones Públicas: Obtienes destino en el Estado, un</text>
<text x="48" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a">Ayuntamiento o en otra Comunidad Autónoma (por transferencia o concurso).</text>
<circle cx="55" cy="326" r="5" fill="#4d9670" />
<text x="73" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Excedencia: Voluntaria (por interés particular, por agrupación familiar), por cuidado</text>
<text x="48" y="364" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">de familiares (hasta </tspan><tspan fill="#7d63a8" font-weight="700">3 años</tspan><tspan fill="#18352a"> por hijo o familiar a cargo), por razón de violencia de</tspan></text>
<text x="48" y="395" font-family="Arial,sans-serif" font-size="17" fill="#18352a">género o violencia terrorista.</text>
<circle cx="55" cy="419" r="5" fill="#4d9670" />
<text x="73" y="426" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Suspensión de funciones: Puede ser provisional (mientras se tramita un expediente,</text>
<text x="48" y="457" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">máximo </tspan><tspan fill="#7d63a8" font-weight="700">6 meses</tspan><tspan fill="#18352a"> salvo paralización imputable al interesado) o firme (por condena o</tspan></text>
<text x="48" y="488" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">sanción disciplinaria, máximo </tspan><tspan fill="#7d63a8" font-weight="700">6 años</tspan><tspan fill="#18352a">).</tspan></text>
<circle cx="55" cy="512" r="5" fill="#4d9670" />
<text x="73" y="519" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Truco de plazos: Suspensión provisional = 6 meses. Suspensión firme = 6 años.</text>
<text x="42" y="597" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
