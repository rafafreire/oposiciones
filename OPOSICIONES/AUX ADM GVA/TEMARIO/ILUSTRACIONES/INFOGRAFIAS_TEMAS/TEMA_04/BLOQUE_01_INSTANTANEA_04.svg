<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 434" role="img" aria-labelledby="title desc">
<title id="title">Instantánea 4: Les Corts Valencianes (Título III, Cap. II)</title>
<desc id="desc">Infografía de repaso del tema 4, basada en Estatuto de Autonomía de la Comunitat Valenciana (LO 5/1982).</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#c47a32">TEMA 04 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#563915">Les Corts Valencianes (Título III, Cap. II)</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Estatuto de Autonomía de la Comunitat Valenciana (LO 5/1982)</text>
<rect x="28" y="148" width="944" height="221" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="282" width="928" height="61" rx="10" fill="#fbf3e8" /><rect x="36" y="282" width="5" height="61" rx="2.5" fill="#c47a32" /><circle cx="55" cy="171" r="5" fill="#4d9670" />
<text x="73" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Número de diputados: No inferior a 99.</text>
<circle cx="55" cy="202" r="5" fill="#4d9670" />
<text x="73" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Mandato: 4 años.</text>
<circle cx="55" cy="233" r="5" fill="#4d9670" />
<text x="73" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Barrera electoral: 5% de los votos emitidos en toda la Comunitat Valenciana.</text>
<circle cx="55" cy="264" r="5" fill="#4d9670" />
<text x="73" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Trampa típica: Ojo con la barrera electoral: es el 5% de los votos emitidos en toda la</text>
<text x="48" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a">Comunitat, no por circunscripción provincial (a diferencia del Congreso de los</text>
<text x="48" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">Diputados, que es el </tspan><tspan fill="#c47a32" font-weight="700">3%</tspan><tspan fill="#18352a"> provincial).</tspan></text>
<text x="42" y="411" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
