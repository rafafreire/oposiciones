<title id="title">Instantánea 1: Tratados Clave</title>
<desc id="desc">Infografía de repaso del tema 7, basada en Unión Europea.</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#386f8f">TEMA 07 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#143b52">Tratados Clave</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Unión Europea</text>
<rect x="28" y="148" width="944" height="252" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="158" width="928" height="92" rx="10" fill="#eaf3f8" /><rect x="36" y="158" width="5" height="92" rx="2.5" fill="#386f8f" /><rect x="36" y="251" width="928" height="92" rx="10" fill="#d7e8f1" /><rect x="36" y="251" width="5" height="92" rx="2.5" fill="#386f8f" /><rect x="36" y="344" width="928" height="30" rx="10" fill="#eaf3f8" /><rect x="36" y="344" width="5" height="30" rx="2.5" fill="#386f8f" /><text x="48" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#386f8f" font-weight="700">1</tspan><tspan fill="#18352a">. París (</tspan><tspan fill="#386f8f" font-weight="700">1951</tspan><tspan fill="#18352a">): Crea la CECA.</tspan></text>
<text x="48" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#386f8f" font-weight="700">2</tspan><tspan fill="#18352a">. Roma (</tspan><tspan fill="#386f8f" font-weight="700">1957</tspan><tspan fill="#18352a">): Crea la CEE y EURATOM.</tspan></text>
<text x="48" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#386f8f" font-weight="700">3</tspan><tspan fill="#18352a">. Acta Única Europea (</tspan><tspan fill="#386f8f" font-weight="700">1986</tspan><tspan fill="#18352a">): Mercado Interior Único.</tspan></text>
<text x="48" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#386f8f" font-weight="700">4</tspan><tspan fill="#18352a">. Maastricht (</tspan><tspan fill="#386f8f" font-weight="700">1992</tspan><tspan fill="#18352a">): Crea la Unión Europea y bases del Euro.</tspan></text>
<text x="48" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#386f8f" font-weight="700">5</tspan><tspan fill="#18352a">. Ámsterdam (</tspan><tspan fill="#386f8f" font-weight="700">1997</tspan><tspan fill="#18352a">) y Niza (</tspan><tspan fill="#386f8f" font-weight="700">2001</tspan><tspan fill="#18352a">): Reformas institucionales.</tspan></text>
<text x="48" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#386f8f" font-weight="700">6</tspan><tspan fill="#18352a">. Lisboa (</tspan><tspan fill="#386f8f" font-weight="700">2007</tspan><tspan fill="#18352a">, en vigor </tspan><tspan fill="#386f8f" font-weight="700">2009</tspan><tspan fill="#18352a">): Tratado vigente (TUE y TFUE), personalidad jurídica</tspan></text>
<text x="48" y="364" font-family="Arial,sans-serif" font-size="17" fill="#18352a">única de la UE.</text>
<text x="42" y="442" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
