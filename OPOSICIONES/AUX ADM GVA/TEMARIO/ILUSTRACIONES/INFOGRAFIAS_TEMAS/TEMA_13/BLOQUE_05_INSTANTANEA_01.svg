<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Instantánea 1: Principios y Estructura (Arts. 1 a 3)</title>
<desc id="desc">Infografía de repaso del tema 13, basada en Régimen Jurídico del Sector Público (Ley 40/2015, de 1 de octubre).</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#386f8f">TEMA 13 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#143b52">Principios y Estructura (Arts. 1 a 3)</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Régimen Jurídico del Sector Público (Ley 40/2015, de 1 de octubre)</text>
<rect x="28" y="148" width="944" height="407" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="220" width="928" height="216" rx="10" fill="#eaf3f8" /><rect x="36" y="220" width="5" height="216" rx="2.5" fill="#386f8f" /><rect x="36" y="437" width="928" height="92" rx="10" fill="#d7e8f1" /><rect x="36" y="437" width="5" height="92" rx="2.5" fill="#386f8f" /><circle cx="55" cy="171" r="5" fill="#4d9670" />
<text x="73" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Estructura: 158 Artículos divididos en un Título Preliminar y 3 Títulos.</text>
<circle cx="55" cy="202" r="5" fill="#4d9670" />
<text x="73" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Título Preliminar: Disposiciones generales, principios de actuación y funcionamiento</text>
<text x="48" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a">del sector público.</text>
<circle cx="55" cy="264" r="5" fill="#4d9670" />
<text x="73" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Título I: Administración General del Estado (AGE).</text>
<circle cx="55" cy="295" r="5" fill="#4d9670" />
<text x="73" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Título II: Organización y funcionamiento del sector público institucional.</text>
<circle cx="55" cy="326" r="5" fill="#4d9670" />
<text x="73" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Título III: Relaciones interadministrativas.</text>
<circle cx="55" cy="357" r="5" fill="#4d9670" />
<text x="73" y="364" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Principios de actuación (Art. 3): Sirven con objetividad los intereses generales y</text>
<text x="48" y="395" font-family="Arial,sans-serif" font-size="17" fill="#18352a">actúan de acuerdo con los principios de eficacia, jerarquía, descentralización,</text>
<text x="48" y="426" font-family="Arial,sans-serif" font-size="17" fill="#18352a">desconcentración y coordinación, con sometimiento pleno a la Constitución, a la Ley y al</text>
<text x="48" y="457" font-family="Arial,sans-serif" font-size="17" fill="#18352a">Derecho.</text>
<circle cx="55" cy="481" r="5" fill="#4d9670" />
<text x="73" y="488" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Truco de examen: Recuerda los clásicos del Art. 103 CE (E-J-D-D-C) más los nuevos como</text>
<text x="48" y="519" font-family="Arial,sans-serif" font-size="17" fill="#18352a">simplicidad, claridad y proximidad a los ciudadanos.</text>
<text x="42" y="597" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
