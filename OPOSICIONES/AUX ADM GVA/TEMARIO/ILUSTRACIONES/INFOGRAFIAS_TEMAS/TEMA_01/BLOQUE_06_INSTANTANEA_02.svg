<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 558" role="img" aria-labelledby="title desc">
<title id="title">Instantánea 2: El Título I y los "Niveles de Protección" (Art. 53)</title>
<desc id="desc">Infografía de repaso del tema 1, basada en Constitución Española de 1978.</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#386f8f">TEMA 01 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#143b52">El Título I y los "Niveles de Protección" (Art. 53)</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Constitución Española de 1978</text>
<rect x="28" y="148" width="944" height="345" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="189" width="928" height="278" rx="10" fill="#eaf3f8" /><rect x="36" y="189" width="5" height="278" rx="2.5" fill="#386f8f" /><circle cx="55" cy="171" r="5" fill="#4d9670" />
<text x="73" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Nivel MÁXIMO (Art. 14 + Sección 1ª Cap. II: Arts. 15 al 29 + Objeción de conciencia</text>
<text x="48" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">Art. </tspan><tspan fill="#386f8f" font-weight="700">30.2</tspan><tspan fill="#18352a">):</tspan></text>
<circle cx="55" cy="233" r="5" fill="#4d9670" />
<text x="73" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Ley Orgánica, procedimiento preferente y sumario, y Recurso de Amparo ante el TC (el</text>
<text x="48" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#386f8f" font-weight="700">30.2</tspan><tspan fill="#18352a"> solo tiene amparo).</tspan></text>
<circle cx="55" cy="295" r="5" fill="#4d9670" />
<text x="73" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Nivel MEDIO (Sección 2ª Cap. II: Arts. 30 al 38):</text>
<circle cx="55" cy="326" r="5" fill="#4d9670" />
<text x="73" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Ley Ordinaria. NO tienen Recurso de Amparo.</text>
<circle cx="55" cy="357" r="5" fill="#4d9670" />
<text x="73" y="364" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Nivel MÍNIMO (Capítulo III: Arts. 39 al 52 — Principios rectores):</text>
<circle cx="55" cy="388" r="5" fill="#4d9670" />
<text x="73" y="395" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Alegables según dispongan las leyes que los desarrollen.</text>
<circle cx="55" cy="419" r="5" fill="#4d9670" />
<text x="73" y="426" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Sanciones administrativas (Art. 25.3): La Administración civil no podrá imponer</text>
<text x="48" y="457" font-family="Arial,sans-serif" font-size="17" fill="#18352a">sanciones que, directa o subsidiariamente, impliquen privación de libertad.</text>
<text x="42" y="535" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
<g aria-hidden="true"><circle cx="918" cy="80" r="34" fill="#ffffff" opacity="0.92" /><circle cx="918" cy="80" r="29" fill="#386f8f" opacity="0.16" /><path d="M891 73 L918 55 L945 73 Z" fill="#fff" stroke="#386f8f" stroke-width="3" stroke-linejoin="round" /><path d="M895 101 H941 M900 96 V77 M910 96 V77 M926 96 V77 M936 96 V77 M893 74 H943" fill="none" stroke="#386f8f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /></g></svg>