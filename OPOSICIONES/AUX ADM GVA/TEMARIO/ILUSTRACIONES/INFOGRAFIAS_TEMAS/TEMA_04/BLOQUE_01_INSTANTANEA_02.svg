<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 434" role="img" aria-labelledby="title desc">
<title id="title">Instantánea 2: Símbolos y Lengua (Título I)</title>
<desc id="desc">Infografía de repaso del tema 4, basada en Estatuto de Autonomía de la Comunitat Valenciana (LO 5/1982).</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#c47a32">TEMA 04 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#563915">Símbolos y Lengua (Título I)</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Estatuto de Autonomía de la Comunitat Valenciana (LO 5/1982)</text>
<rect x="28" y="148" width="944" height="221" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="189" width="928" height="154" rx="10" fill="#fbf3e8" /><rect x="36" y="189" width="5" height="154" rx="2.5" fill="#c47a32" /><circle cx="55" cy="171" r="5" fill="#4d9670" />
<text x="73" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Bandera: La tradicional Senyera (cuatro barras rojas sobre fondo amarillo, coronadas</text>
<text x="48" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a">sobre franja azul junto al asta).</text>
<circle cx="55" cy="233" r="5" fill="#4d9670" />
<text x="73" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Lengua propia: El valenciano. La institución normativa es la Acadèmia Valenciana de la</text>
<text x="48" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a">Llengua (AVL).</text>
<circle cx="55" cy="295" r="5" fill="#4d9670" />
<text x="73" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Trampa típica: El castellano es oficial en todo el Estado, pero el valenciano es la</text>
<text x="48" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a">lengua propia y también oficial en la Comunitat.</text>
<text x="42" y="411" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
