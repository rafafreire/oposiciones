<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 682" role="img" aria-labelledby="title desc">
<title id="title">Instantánea 4: Notificaciones y Sucesión de Intentos (Arts. 40 a 44)</title>
<desc id="desc">Infografía de repaso del tema 11, basada en Procedimiento Administrativo Común (Ley 39/2015, de 1 de octubre).</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#258b8b">TEMA 11 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#164847">Notificaciones y Sucesión de Intentos (Arts. 40 a 44)</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Procedimiento Administrativo Común (Ley 39/2015, de 1 de octubre)</text>
<rect x="28" y="148" width="944" height="469" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="251" width="928" height="185" rx="10" fill="#e9f5f3" /><rect x="36" y="251" width="5" height="185" rx="2.5" fill="#258b8b" /><rect x="36" y="468" width="928" height="123" rx="10" fill="#d9eeeb" /><rect x="36" y="468" width="5" height="123" rx="2.5" fill="#258b8b" /><circle cx="55" cy="171" r="5" fill="#4d9670" />
<text x="73" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Plazo para cursar la notificación: 10 días desde que el acto haya sido dictado.</text>
<circle cx="55" cy="202" r="5" fill="#4d9670" />
<text x="73" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Notificación en papel (en domicilio):</text>
<circle cx="55" cy="233" r="5" fill="#4d9670" />
<text x="73" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Si nadie se hace cargo, se hace constar y se repite el intento una sola vez y en una</text>
<text x="48" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">hora distinta dentro de los </tspan><tspan fill="#258b8b" font-weight="700">3 días</tspan><tspan fill="#18352a"> siguientes.</tspan></text>
<circle cx="55" cy="295" r="5" fill="#4d9670" />
<text x="73" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Regla de las 3 horas: Si el 1º intento fue antes de las 15:00 h, el 2º debe ser</text>
<text x="48" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">después de las </tspan><tspan fill="#258b8b" font-weight="700">15</tspan><tspan fill="#18352a">:</tspan><tspan fill="#258b8b" font-weight="700">00</tspan><tspan fill="#18352a"> h (y viceversa), dejando un margen de al menos </tspan><tspan fill="#258b8b" font-weight="700">3 horas</tspan><tspan fill="#18352a"> entre ambos.</tspan></text>
<circle cx="55" cy="357" r="5" fill="#4d9670" />
<text x="73" y="364" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Notificación electrónica:</text>
<circle cx="55" cy="388" r="5" fill="#4d9670" />
<text x="73" y="395" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Se entiende rechazada (y por tanto, realizada) cuando hayan transcurrido 10 días</text>
<text x="48" y="426" font-family="Arial,sans-serif" font-size="17" fill="#18352a">naturales desde la puesta a disposición sin que se acceda a su contenido.</text>
<circle cx="55" cy="450" r="5" fill="#4d9670" />
<text x="73" y="457" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Trampa mortal: Todos los plazos de la Ley 39/2015 son en días hábiles EXCEPTO este: el</text>
<text x="48" y="488" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">rechazo de la notificación electrónica son </tspan><tspan fill="#258b8b" font-weight="700">10 días</tspan><tspan fill="#18352a"> NATURALES.</tspan></text>
<circle cx="55" cy="512" r="5" fill="#4d9670" />
<text x="73" y="519" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Recibo de registro (Art. 16.3): El registro electrónico emitirá automáticamente un</text>
<text x="48" y="550" font-family="Arial,sans-serif" font-size="17" fill="#18352a">recibo consistente en una copia autenticada del escrito, incluyendo la fecha y hora de</text>
<text x="48" y="581" font-family="Arial,sans-serif" font-size="17" fill="#18352a">presentación y el número de entrada de registro.</text>
<text x="42" y="659" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
<g aria-hidden="true"><circle cx="918" cy="80" r="34" fill="#ffffff" opacity="0.92" /><circle cx="918" cy="80" r="29" fill="#258b8b" opacity="0.16" /><path d="M891 73 L918 55 L945 73 Z" fill="#fff" stroke="#258b8b" stroke-width="3" stroke-linejoin="round" /><path d="M895 101 H941 M900 96 V77 M910 96 V77 M926 96 V77 M936 96 V77 M893 74 H943" fill="none" stroke="#258b8b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /></g></svg>