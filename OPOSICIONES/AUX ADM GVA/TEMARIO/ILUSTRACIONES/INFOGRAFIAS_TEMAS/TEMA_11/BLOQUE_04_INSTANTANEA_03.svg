<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 651" role="img" aria-labelledby="title desc">
<title id="title">Instantánea 3: El Silencio Administrativo (Arts. 24 y 25)</title>
<desc id="desc">Infografía de repaso del tema 11, basada en Procedimiento Administrativo Común (Ley 39/2015, de 1 de octubre).</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#258b8b">TEMA 11 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#164847">El Silencio Administrativo (Arts. 24 y 25)</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Procedimiento Administrativo Común (Ley 39/2015, de 1 de octubre)</text>
<rect x="28" y="148" width="944" height="438" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="251" width="928" height="92" rx="10" fill="#e9f5f3" /><rect x="36" y="251" width="5" height="92" rx="2.5" fill="#258b8b" /><rect x="36" y="344" width="928" height="92" rx="10" fill="#d9eeeb" /><rect x="36" y="344" width="5" height="92" rx="2.5" fill="#258b8b" /><rect x="36" y="437" width="928" height="30" rx="10" fill="#e9f5f3" /><rect x="36" y="437" width="5" height="30" rx="2.5" fill="#258b8b" /><circle cx="55" cy="171" r="5" fill="#4d9670" />
<text x="73" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Procedimientos iniciados a SOLICITUD DEL INTERESADO (Art. 24):</text>
<circle cx="55" cy="202" r="5" fill="#4d9670" />
<text x="73" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Regla general: Silencio POSITIVO (estimatorio).</text>
<circle cx="55" cy="233" r="5" fill="#4d9670" />
<text x="73" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Excepciones (Silencio NEGATIVO):</text>
<text x="48" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#258b8b" font-weight="700">1</tspan><tspan fill="#18352a">. Ejercicio del derecho de petición (Art. </tspan><tspan fill="#258b8b" font-weight="700">29</tspan><tspan fill="#18352a"> CE).</tspan></text>
<text x="48" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#258b8b" font-weight="700">2</tspan><tspan fill="#18352a">. Transferencia de facultades relativas al dominio público o servicio público.</tspan></text>
<text x="48" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#258b8b" font-weight="700">3</tspan><tspan fill="#18352a">. Actividades que puedan dañar el medio ambiente.</tspan></text>
<text x="48" y="364" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#258b8b" font-weight="700">4</tspan><tspan fill="#18352a">. Procedimientos de responsabilidad patrimonial de las Administraciones Públicas.</tspan></text>
<text x="48" y="395" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#258b8b" font-weight="700">5</tspan><tspan fill="#18352a">. Impugnación de actos y disposiciones (recursos administrativos) y revisión de oficio.</tspan></text>
<text x="48" y="426" font-family="Arial,sans-serif" font-size="17" fill="#18352a">(Excepción de la excepción: el recurso de alzada contra un silencio negativo previo =</text>
<text x="48" y="457" font-family="Arial,sans-serif" font-size="17" fill="#18352a">silencio POSITIVO).</text>
<circle cx="55" cy="481" r="5" fill="#4d9670" />
<text x="73" y="488" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Procedimientos iniciados DE OFICIO (Art. 25):</text>
<circle cx="55" cy="512" r="5" fill="#4d9670" />
<text x="73" y="519" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Si derivan efectos favorables (reconocimiento de derechos) -&gt; Silencio NEGATIVO.</text>
<circle cx="55" cy="543" r="5" fill="#4d9670" />
<text x="73" y="550" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Si son sancionadores o desfavorables -&gt; CADUCIDAD (se archiva el expediente).</text>
<text x="42" y="628" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
