<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 589" role="img" aria-labelledby="title desc">
<title id="title">Instantánea 2: El President de la Generalitat (Título I)</title>
<desc id="desc">Infografía de repaso del tema 5, basada en Ley del Consell (Ley 5/1983, de 30 de diciembre).</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#258b8b">TEMA 05 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#164847">El President de la Generalitat (Título I)</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Ley del Consell (Ley 5/1983, de 30 de diciembre)</text>
<rect x="28" y="148" width="944" height="376" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="189" width="928" height="123" rx="10" fill="#e9f5f3" /><rect x="36" y="189" width="5" height="123" rx="2.5" fill="#258b8b" /><rect x="36" y="344" width="928" height="123" rx="10" fill="#d9eeeb" /><rect x="36" y="344" width="5" height="123" rx="2.5" fill="#258b8b" /><rect x="36" y="468" width="928" height="30" rx="10" fill="#e9f5f3" /><rect x="36" y="468" width="5" height="30" rx="2.5" fill="#258b8b" /><circle cx="55" cy="171" r="5" fill="#4d9670" />
<text x="73" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Doble condición: Es el más alto representante de la Comunitat Valenciana</text>
<text x="48" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a">(representación ordinaria del Estado en ella) y Presidente del Consell (dirige la acción</text>
<text x="48" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a">de gobierno).</text>
<circle cx="55" cy="264" r="5" fill="#4d9670" />
<text x="73" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Incompatibilidades: Su cargo es incompatible con cualquier otra función pública</text>
<text x="48" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a">(excepto la de Diputado de Les Corts) y con cualquier actividad profesional o mercantil.</text>
<circle cx="55" cy="326" r="5" fill="#4d9670" />
<text x="73" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• ¿Qué pasa si cesa o fallece? (Orden de sustitución):</text>
<text x="48" y="364" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#258b8b" font-weight="700">1</tspan><tspan fill="#18352a">. Los Vicepresidentes (por su orden).</tspan></text>
<text x="48" y="395" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#258b8b" font-weight="700">2</tspan><tspan fill="#18352a">. Los Consellers (según el orden de precedencia de las Consellerias).</tspan></text>
<circle cx="55" cy="419" r="5" fill="#4d9670" />
<text x="73" y="426" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Trampa de examen: El President en funciones NO puede plantear una cuestión de</text>
<text x="48" y="457" font-family="Arial,sans-serif" font-size="17" fill="#18352a">confianza, ni proponer la disolución de Les Corts, ni ser objeto de una moción de</text>
<text x="48" y="488" font-family="Arial,sans-serif" font-size="17" fill="#18352a">censura.</text>
<text x="42" y="566" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
<g aria-hidden="true"><circle cx="918" cy="80" r="34" fill="#ffffff" opacity="0.92" /><circle cx="918" cy="80" r="29" fill="#258b8b" opacity="0.16" /><path d="M891 73 L918 55 L945 73 Z" fill="#fff" stroke="#258b8b" stroke-width="3" stroke-linejoin="round" /><path d="M895 101 H941 M900 96 V77 M910 96 V77 M926 96 V77 M936 96 V77 M893 74 H943" fill="none" stroke="#258b8b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /></g></svg>