<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 465" role="img" aria-labelledby="title desc">
<title id="title">Instantánea 4: La Corona (Título II: Arts. 56 al 65)</title>
<desc id="desc">Infografía de repaso del tema 2, basada en Constitución Española de 1978.</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#4d9670">TEMA 02 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#173b2b">La Corona (Título II: Arts. 56 al 65)</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Constitución Española de 1978</text>
<rect x="28" y="148" width="944" height="252" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="189" width="928" height="123" rx="10" fill="#edf6ef" /><rect x="36" y="189" width="5" height="123" rx="2.5" fill="#4d9670" /><rect x="36" y="344" width="928" height="30" rx="10" fill="#e0f0e4" /><rect x="36" y="344" width="5" height="30" rx="2.5" fill="#4d9670" /><circle cx="55" cy="171" r="5" fill="#4d9670" />
<text x="73" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Inviolabilidad y Refrendo: Sus actos carecen de validez sin refrendo, salvo el</text>
<text x="48" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">nombramiento y relevo de los miembros civiles y militares de su Casa (Art. </tspan><tspan fill="#4d9670" font-weight="700">65.2</tspan><tspan fill="#18352a">).</tspan></text>
<circle cx="55" cy="233" r="5" fill="#4d9670" />
<text x="73" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Orden de sucesión: Primogenitura y representación: 1º Línea anterior sobre posterior;</text>
<text x="48" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a">2º Grado más próximo; 3º En el mismo grado, varón sobre mujer; 4º En el mismo sexo,</text>
<text x="48" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a">mayor edad.</text>
<circle cx="55" cy="326" r="5" fill="#4d9670" />
<text x="73" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Regencia y Tutela: Regencia por padre/madre o pariente mayor de edad más próximo.</text>
<text x="48" y="364" font-family="Arial,sans-serif" font-size="17" fill="#18352a">Tutela testamentaria requiere ser mayor de edad y español de nacimiento.</text>
<text x="42" y="442" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
