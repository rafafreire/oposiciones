<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 558" role="img" aria-labelledby="title desc">
<title id="title">Instantánea 6: Responsabilidad Patrimonial (Arts. 32 a 37)</title>
<desc id="desc">Infografía de repaso del tema 13, basada en Régimen Jurídico del Sector Público (Ley 40/2015, de 1 de octubre).</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#386f8f">TEMA 13 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#143b52">Responsabilidad Patrimonial (Arts. 32 a 37)</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Régimen Jurídico del Sector Público (Ley 40/2015, de 1 de octubre)</text>
<rect x="28" y="148" width="944" height="345" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="189" width="928" height="123" rx="10" fill="#eaf3f8" /><rect x="36" y="189" width="5" height="123" rx="2.5" fill="#386f8f" /><rect x="36" y="344" width="928" height="123" rx="10" fill="#d7e8f1" /><rect x="36" y="344" width="5" height="123" rx="2.5" fill="#386f8f" /><circle cx="55" cy="171" r="5" fill="#4d9670" />
<text x="73" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Requisitos del daño: Efectivo, evaluable económicamente e individualizado, y que el</text>
<text x="48" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a">particular no tenga el deber jurídico de soportar.</text>
<circle cx="55" cy="233" r="5" fill="#4d9670" />
<text x="73" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Exclusión: No se indemnizan los daños derivados de fuerza mayor (externa e</text>
<text x="48" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a">imprevisible), pero SÍ se indemnizan los derivados de caso fortuito (fallos internos del</text>
<text x="48" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a">servicio).</text>
<circle cx="55" cy="326" r="5" fill="#4d9670" />
<text x="73" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Plazo para reclamar (Art. 67 Ley 39/2015): Prescribe al año de producido el hecho o</text>
<text x="48" y="364" font-family="Arial,sans-serif" font-size="17" fill="#18352a">manifestado el efecto lesivo.</text>
<circle cx="55" cy="388" r="5" fill="#4d9670" />
<text x="73" y="395" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Acción de regreso (Art. 36): Si la Administración indemniza por culpa de un</text>
<text x="48" y="426" font-family="Arial,sans-serif" font-size="17" fill="#18352a">funcionario que actuó con dolo, culpa o negligencia grave, exigirá de oficio a ese</text>
<text x="48" y="457" font-family="Arial,sans-serif" font-size="17" fill="#18352a">funcionario su responsabilidad.</text>
<text x="42" y="535" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
<g aria-hidden="true"><circle cx="918" cy="80" r="34" fill="#ffffff" opacity="0.92" /><circle cx="918" cy="80" r="29" fill="#386f8f" opacity="0.16" /><path d="M891 73 L918 55 L945 73 Z" fill="#fff" stroke="#386f8f" stroke-width="3" stroke-linejoin="round" /><path d="M895 101 H941 M900 96 V77 M910 96 V77 M926 96 V77 M936 96 V77 M893 74 H943" fill="none" stroke="#386f8f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /></g></svg>