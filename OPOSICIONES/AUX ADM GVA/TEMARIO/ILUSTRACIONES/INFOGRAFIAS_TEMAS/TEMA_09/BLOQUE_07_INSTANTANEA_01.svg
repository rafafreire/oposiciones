<title id="title">Instantánea 1: Las dos normas y su objeto</title>
<desc id="desc">Infografía de repaso del tema 9, basada en Transparencia y Buen Gobierno (Ley 19/2013 y Ley 1/2022 GVA).</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#7d63a8">TEMA 09 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#3c2f57">Las dos normas y su objeto</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Transparencia y Buen Gobierno (Ley 19/2013 y Ley 1/2022 GVA)</text>
<rect x="28" y="148" width="944" height="252" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="220" width="928" height="154" rx="10" fill="#f3eff8" /><rect x="36" y="220" width="5" height="154" rx="2.5" fill="#7d63a8" /><circle cx="55" cy="171" r="5" fill="#4d9670" />
<text x="73" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Norma Estatal: Ley 19/2013, de 9 de diciembre.</text>
<circle cx="55" cy="202" r="5" fill="#4d9670" />
<text x="73" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Norma Valenciana: Ley 1/2022, de 13 de abril, de Transparencia y Buen Gobierno de la</text>
<text x="48" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">Comunitat Valenciana (derogó a la Ley </tspan><tspan fill="#7d63a8" font-weight="700">2</tspan><tspan fill="#18352a">/</tspan><tspan fill="#7d63a8" font-weight="700">2015</tspan><tspan fill="#18352a">).</tspan></text>
<circle cx="55" cy="264" r="5" fill="#4d9670" />
<text x="73" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Doble vertiente: Publicidad activa (GVA Oberta) y Derecho de acceso a la información</text>
<text x="48" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a">pública.</text>
<circle cx="55" cy="326" r="5" fill="#4d9670" />
<text x="73" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Trampa: Para solicitar información pública NO es necesario acreditar interés legítimo</text>
<text x="48" y="364" font-family="Arial,sans-serif" font-size="17" fill="#18352a">ni motivar la solicitud.</text>
<text x="42" y="442" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
