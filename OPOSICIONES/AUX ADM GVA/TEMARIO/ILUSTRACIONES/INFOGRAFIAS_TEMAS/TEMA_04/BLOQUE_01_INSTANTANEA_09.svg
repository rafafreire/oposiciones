<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 558" role="img" aria-labelledby="title desc">
<title id="title">Instantánea 9: Las leyes de la Generalitat (Art. 44)</title>
<desc id="desc">Infografía de repaso del tema 4, basada en Estatuto de Autonomía de la Comunitat Valenciana (LO 5/1982).</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#c47a32">TEMA 04 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#563915">Las leyes de la Generalitat (Art. 44)</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Estatuto de Autonomía de la Comunitat Valenciana (LO 5/1982)</text>
<rect x="28" y="148" width="944" height="345" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="189" width="928" height="123" rx="10" fill="#fbf3e8" /><rect x="36" y="189" width="5" height="123" rx="2.5" fill="#c47a32" /><rect x="36" y="344" width="928" height="123" rx="10" fill="#f6e8d5" /><rect x="36" y="344" width="5" height="123" rx="2.5" fill="#c47a32" /><circle cx="55" cy="171" r="5" fill="#4d9670" />
<text x="73" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• ¿Quién tiene la iniciativa legislativa? El Consell y los miembros de Les Corts (en los</text>
<text x="48" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a">términos que diga el Reglamento). También existe la Iniciativa Legislativa Popular</text>
<text x="48" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a">(ILP).</text>
<circle cx="55" cy="264" r="5" fill="#4d9670" />
<text x="73" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Decretos Legislativos (Art. 44.3): Les Corts pueden delegar en el Consell la potestad</text>
<text x="48" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">de dictar normas con rango de ley (igual que el Art. </tspan><tspan fill="#c47a32" font-weight="700">82</tspan><tspan fill="#18352a"> de la Constitución).</tspan></text>
<circle cx="55" cy="326" r="5" fill="#4d9670" />
<text x="73" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Decretos-Leyes (Art. 44.4): En caso de extraordinaria y urgente necesidad, el Consell</text>
<text x="48" y="364" font-family="Arial,sans-serif" font-size="17" fill="#18352a">puede dictarlos.</text>
<circle cx="55" cy="388" r="5" fill="#4d9670" />
<text x="73" y="395" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Trampa de examen: No pueden afectar al ordenamiento de las instituciones básicas,</text>
<text x="48" y="426" font-family="Arial,sans-serif" font-size="17" fill="#18352a">derechos y libertades, régimen electoral, ni al presupuesto. Deben ser convalidados o</text>
<text x="48" y="457" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">derogados por Les Corts en el plazo de </tspan><tspan fill="#c47a32" font-weight="700">30 días</tspan><tspan fill="#18352a"> siguientes a su promulgación.</tspan></text>
<text x="42" y="535" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
