<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 434" role="img" aria-labelledby="title desc">
<title id="title">Instantánea 1: Conceptos Básicos (Arts. 3 a 8 LOIEMH)</title>
<desc id="desc">Infografía de repaso del tema 8, basada en Igualdad Efectiva entre Mujeres y Hombres (LO 3/2007 y Ley 9/2003 GVA).</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#4d9670">TEMA 08 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#173b2b">Conceptos Básicos (Arts. 3 a 8 LOIEMH)</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Igualdad Efectiva entre Mujeres y Hombres (LO 3/2007 y Ley 9/2003 GVA)</text>
<rect x="28" y="148" width="944" height="221" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="189" width="928" height="154" rx="10" fill="#edf6ef" /><rect x="36" y="189" width="5" height="154" rx="2.5" fill="#4d9670" /><circle cx="55" cy="171" r="5" fill="#4d9670" />
<text x="73" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Discriminación DIRECTA: Trato menos favorable por razón de sexo. (Todo trato</text>
<text x="48" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a">desfavorable por embarazo o maternidad es siempre discriminación directa).</text>
<circle cx="55" cy="233" r="5" fill="#4d9670" />
<text x="73" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Discriminación INDIRECTA: Disposición o práctica aparentemente neutra que pone en</text>
<text x="48" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a">desventaja particular a un sexo.</text>
<circle cx="55" cy="295" r="5" fill="#4d9670" />
<text x="73" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Acoso sexual vs. Acoso por razón de sexo: El primero tiene naturaleza sexual; el</text>
<text x="48" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a">segundo se realiza en función del sexo de la persona.</text>
<text x="42" y="411" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
