<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 527" role="img" aria-labelledby="title desc">
<title id="title">Instantánea 5: Estructura de la Administración (Título IV)</title>
<desc id="desc">Infografía de repaso del tema 6, basada en Ley del Consell (Ley 5/1983, de 30 de diciembre).</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#b65a70">TEMA 06 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#512b35">Estructura de la Administración (Título IV)</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Ley del Consell (Ley 5/1983, de 30 de diciembre)</text>
<rect x="28" y="148" width="944" height="314" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="189" width="928" height="216" rx="10" fill="#fbf0f2" /><rect x="36" y="189" width="5" height="216" rx="2.5" fill="#b65a70" /><rect x="36" y="406" width="928" height="30" rx="10" fill="#f5e2e7" /><rect x="36" y="406" width="5" height="30" rx="2.5" fill="#b65a70" /><circle cx="55" cy="171" r="5" fill="#4d9670" />
<text x="73" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Órganos Superiores de las Consellerias:</text>
<text x="48" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#b65a70" font-weight="700">1</tspan><tspan fill="#18352a">. El Conseller.</tspan></text>
<text x="48" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#b65a70" font-weight="700">2</tspan><tspan fill="#18352a">. Los Secretarios Autonómicos.</tspan></text>
<circle cx="55" cy="264" r="5" fill="#4d9670" />
<text x="73" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Nivel Directivo (bajo la dependencia de los superiores):</text>
<circle cx="55" cy="295" r="5" fill="#4d9670" />
<text x="73" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Los Subsecretarios.</text>
<circle cx="55" cy="326" r="5" fill="#4d9670" />
<text x="73" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Los Directores Generales (y otros órganos asimilados).</text>
<circle cx="55" cy="357" r="5" fill="#4d9670" />
<text x="73" y="364" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Trampa clásica de C2: Solo son órganos superiores el Conseller y el Secretario</text>
<text x="48" y="395" font-family="Arial,sans-serif" font-size="17" fill="#18352a">Autonómico. El Subsecretario y el Director General son nivel directivo, NO órganos</text>
<text x="48" y="426" font-family="Arial,sans-serif" font-size="17" fill="#18352a">superiores.</text>
<text x="42" y="504" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
<g aria-hidden="true"><circle cx="918" cy="80" r="34" fill="#ffffff" opacity="0.92" /><circle cx="918" cy="80" r="29" fill="#b65a70" opacity="0.16" /><path d="M891 73 L918 55 L945 73 Z" fill="#fff" stroke="#b65a70" stroke-width="3" stroke-linejoin="round" /><path d="M895 101 H941 M900 96 V77 M910 96 V77 M926 96 V77 M936 96 V77 M893 74 H943" fill="none" stroke="#b65a70" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /></g></svg>