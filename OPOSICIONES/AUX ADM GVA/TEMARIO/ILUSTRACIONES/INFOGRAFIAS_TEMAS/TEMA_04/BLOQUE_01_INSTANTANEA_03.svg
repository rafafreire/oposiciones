<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Instantánea 3: La Generalitat y sus instituciones (Título III)</title>
<desc id="desc">Infografía de repaso del tema 4, basada en Estatuto de Autonomía de la Comunitat Valenciana (LO 5/1982).</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#c47a32">TEMA 04 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#563915">La Generalitat y sus instituciones (Título III)</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Estatuto de Autonomía de la Comunitat Valenciana (LO 5/1982)</text>
<rect x="28" y="148" width="944" height="407" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="189" width="928" height="123" rx="10" fill="#fbf3e8" /><rect x="36" y="189" width="5" height="123" rx="2.5" fill="#c47a32" /><rect x="36" y="313" width="928" height="123" rx="10" fill="#f6e8d5" /><rect x="36" y="313" width="5" height="123" rx="2.5" fill="#c47a32" /><rect x="36" y="468" width="928" height="61" rx="10" fill="#fbf3e8" /><rect x="36" y="468" width="5" height="61" rx="2.5" fill="#c47a32" /><circle cx="55" cy="171" r="5" fill="#4d9670" />
<text x="73" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• ¿Qué es la Generalitat? Es el conjunto de instituciones de autogobierno (no solo el</text>
<text x="48" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a">gobierno).</text>
<circle cx="55" cy="233" r="5" fill="#4d9670" />
<text x="73" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Las 3 básicas:</text>
<text x="48" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#c47a32" font-weight="700">1</tspan><tspan fill="#18352a">. Les Corts (Poder Legislativo).</tspan></text>
<text x="48" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#c47a32" font-weight="700">2</tspan><tspan fill="#18352a">. El President (Máximo representante y jefe del Consell).</tspan></text>
<text x="48" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#c47a32" font-weight="700">3</tspan><tspan fill="#18352a">. El Consell (Poder Ejecutivo).</tspan></text>
<circle cx="55" cy="357" r="5" fill="#4d9670" />
<text x="73" y="364" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Las otras instituciones estatutarias (el "pack" de 5): Síndic de Greuges, Sindicatura</text>
<text x="48" y="395" font-family="Arial,sans-serif" font-size="17" fill="#18352a">de Comptes, Consell Valencià de Cultura, Acadèmia Valenciana de la Llengua (AVL) y</text>
<text x="48" y="426" font-family="Arial,sans-serif" font-size="17" fill="#18352a">Comité Econòmic i Social (CES).</text>
<circle cx="55" cy="450" r="5" fill="#4d9670" />
<text x="73" y="457" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Truco: Memoriza las iniciales S-S-C-A-C (Síndic, Sindicatura, Cultura, Acadèmia,</text>
<text x="48" y="488" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">Comité). Todas se regulan por Ley de Les Corts y necesitan mayoría de </tspan><tspan fill="#c47a32" font-weight="700">3</tspan><tspan fill="#18352a">/</tspan><tspan fill="#c47a32" font-weight="700">5</tspan><tspan fill="#18352a"> para elegir a</tspan></text>
<text x="48" y="519" font-family="Arial,sans-serif" font-size="17" fill="#18352a">sus miembros.</text>
<text x="42" y="597" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
