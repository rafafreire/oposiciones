<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 713" role="img" aria-labelledby="title desc">
<title id="title">Instantánea 7: Condiciones de Trabajo en la GVA (Decreto 42/2019 — Exámenes GVA)</title>
<desc id="desc">Infografía de repaso del tema 16, basada en Ley de la Función Pública Valenciana (Ley 4/2021, de 16 de abril).</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#c47a32">TEMA 16 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#563915">Condiciones de Trabajo en la GVA (Decreto 42/2019 — Exámenes GVA)</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Ley de la Función Pública Valenciana (Ley 4/2021, de 16 de abril)</text>
<rect x="28" y="148" width="944" height="500" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="189" width="928" height="154" rx="10" fill="#fbf3e8" /><rect x="36" y="189" width="5" height="154" rx="2.5" fill="#c47a32" /><rect x="36" y="406" width="928" height="154" rx="10" fill="#f6e8d5" /><rect x="36" y="406" width="5" height="154" rx="2.5" fill="#c47a32" /><rect x="36" y="592" width="928" height="30" rx="10" fill="#fbf3e8" /><rect x="36" y="592" width="5" height="30" rx="2.5" fill="#c47a32" /><circle cx="55" cy="171" r="5" fill="#4d9670" />
<text x="73" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Jornada ordinaria: 37 horas y 30 minutos semanales de promedio en cómputo anual</text>
<text x="48" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">(horario fijo obligatorio de </tspan><tspan fill="#c47a32" font-weight="700">9</tspan><tspan fill="#18352a">:</tspan><tspan fill="#c47a32" font-weight="700">00</tspan><tspan fill="#18352a"> a </tspan><tspan fill="#c47a32" font-weight="700">14</tspan><tspan fill="#18352a">:</tspan><tspan fill="#c47a32" font-weight="700">30</tspan><tspan fill="#18352a"> h, resto flexible).</tspan></text>
<circle cx="55" cy="233" r="5" fill="#4d9670" />
<text x="73" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Vacaciones retribuidas: 22 días hábiles por cada año completo de servicio (no cuentan</text>
<text x="48" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a">los sábados como hábiles).</text>
<circle cx="55" cy="295" r="5" fill="#4d9670" />
<text x="73" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Días adicionales por antigüedad (trienios): 15 años = 23 días | 20 años = 24 días | 25</text>
<text x="48" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">años = </tspan><tspan fill="#c47a32" font-weight="700">25 días</tspan><tspan fill="#18352a"> | </tspan><tspan fill="#c47a32" font-weight="700">30</tspan><tspan fill="#18352a"> o más años = </tspan><tspan fill="#c47a32" font-weight="700">26 días</tspan><tspan fill="#18352a">.</tspan></text>
<circle cx="55" cy="357" r="5" fill="#4d9670" />
<text x="73" y="364" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Días por asuntos particulares ("moscosos"): 6 días al año.</text>
<circle cx="55" cy="388" r="5" fill="#4d9670" />
<text x="73" y="395" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Días adicionales por antigüedad: Al cumplir el 6º trienio (18 años) se suman 2 días</text>
<text x="48" y="426" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">adicionales, incrementándose en </tspan><tspan fill="#c47a32" font-weight="700">1 día</tspan><tspan fill="#18352a"> adicional por cada trienio cumplido a partir del</tspan></text>
<text x="48" y="457" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">8º (</tspan><tspan fill="#c47a32" font-weight="700">24 años</tspan><tspan fill="#18352a">).</tspan></text>
<circle cx="55" cy="481" r="5" fill="#4d9670" />
<text x="73" y="488" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Permiso por fallecimiento, accidente o enfermedad grave:</text>
<circle cx="55" cy="512" r="5" fill="#4d9670" />
<text x="73" y="519" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• 1º grado (cónyuge/pareja de hecho, padres, hijos, suegros): 3 días hábiles en la misma</text>
<text x="48" y="550" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">localidad, </tspan><tspan fill="#c47a32" font-weight="700">5 días</tspan><tspan fill="#18352a"> hábiles en distinta localidad.</tspan></text>
<circle cx="55" cy="574" r="5" fill="#4d9670" />
<text x="73" y="581" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• 2º grado (hermanos, abuelos, nietos, cuñados): 2 días hábiles en la misma localidad, 4</text>
<text x="48" y="612" font-family="Arial,sans-serif" font-size="17" fill="#18352a">días hábiles en distinta localidad.</text>
<text x="42" y="690" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
