<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 527" role="img" aria-labelledby="title desc">
<title id="title">Instantánea 3: Suspensión de Derechos: Alarma, Excepción y Sitio (Arts. 55 y 116)</title>
<desc id="desc">Infografía de repaso del tema 1, basada en Constitución Española de 1978.</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#386f8f">TEMA 01 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#143b52">Suspensión de Derechos: Alarma, Excepción y Sitio (Arts. 55 y 116)</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Constitución Española de 1978</text>
<rect x="28" y="148" width="944" height="314" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="158" width="928" height="92" rx="10" fill="#eaf3f8" /><rect x="36" y="158" width="5" height="92" rx="2.5" fill="#386f8f" /><rect x="36" y="251" width="928" height="92" rx="10" fill="#d7e8f1" /><rect x="36" y="251" width="5" height="92" rx="2.5" fill="#386f8f" /><rect x="36" y="375" width="928" height="61" rx="10" fill="#eaf3f8" /><rect x="36" y="375" width="5" height="61" rx="2.5" fill="#386f8f" /><text x="48" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#386f8f" font-weight="700">1</tspan><tspan fill="#18352a">. Estado de ALARMA: Lo declara el Gobierno por Decreto (máx. </tspan><tspan fill="#386f8f" font-weight="700">15 días</tspan><tspan fill="#18352a">, prórroga con</tspan></text>
<text x="48" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a">autorización del Congreso). NO suspende ningún derecho, solo los limita.</text>
<text x="48" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#386f8f" font-weight="700">2</tspan><tspan fill="#18352a">. Estado de EXCEPCIÓN: Lo declara el Gobierno previa autorización del Congreso (máx. </tspan><tspan fill="#386f8f" font-weight="700">30</tspan></text>
<text x="48" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">días, prorrogables otros </tspan><tspan fill="#386f8f" font-weight="700">30</tspan><tspan fill="#18352a">).</tspan></text>
<text x="48" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#386f8f" font-weight="700">3</tspan><tspan fill="#18352a">. Estado de SITIO: Lo declara la mayoría absoluta del Congreso a propuesta exclusiva</tspan></text>
<text x="48" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a">del Gobierno.</text>
<circle cx="55" cy="357" r="5" fill="#4d9670" />
<text x="73" y="364" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Truco de detención preventiva: En Excepción se puede ampliar la detención hasta 10</text>
<text x="48" y="395" font-family="Arial,sans-serif" font-size="17" fill="#18352a">días, pero NO se suspende el derecho a ser informado ni la asistencia de abogado (estos</text>
<text x="48" y="426" font-family="Arial,sans-serif" font-size="17" fill="#18352a">dos solo se suspenden en estado de Sitio).</text>
<text x="42" y="504" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
<g aria-hidden="true"><circle cx="918" cy="80" r="34" fill="#ffffff" opacity="0.92" /><circle cx="918" cy="80" r="29" fill="#386f8f" opacity="0.16" /><path d="M891 73 L918 55 L945 73 Z" fill="#fff" stroke="#386f8f" stroke-width="3" stroke-linejoin="round" /><path d="M895 101 H941 M900 96 V77 M910 96 V77 M926 96 V77 M936 96 V77 M893 74 H943" fill="none" stroke="#386f8f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /></g></svg>