<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 558" role="img" aria-labelledby="title desc">
<title id="title">Instantánea 7: Los Recursos Administrativos (Arts. 112 a 126)</title>
<desc id="desc">Infografía de repaso del tema 12, basada en Procedimiento Administrativo Común (Ley 39/2015, de 1 de octubre).</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#b65a70">TEMA 12 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#512b35">Los Recursos Administrativos (Arts. 112 a 126)</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Procedimiento Administrativo Común (Ley 39/2015, de 1 de octubre)</text>
<rect x="28" y="148" width="944" height="345" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="158" width="928" height="92" rx="10" fill="#fbf0f2" /><rect x="36" y="158" width="5" height="92" rx="2.5" fill="#b65a70" /><rect x="36" y="251" width="928" height="92" rx="10" fill="#f5e2e7" /><rect x="36" y="251" width="5" height="92" rx="2.5" fill="#b65a70" /><rect x="36" y="344" width="928" height="123" rx="10" fill="#fbf0f2" /><rect x="36" y="344" width="5" height="123" rx="2.5" fill="#b65a70" /><text x="48" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a">Recurso   •   ¿Contra qué actos?   •   Plazo Interposición (Acto expreso)   •   Plazo</text>
<text x="48" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a">Interposición (Silencio)   •   Plazo para Resolver</text>
<text x="48" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">ALZADA   •   No ponen fin a la vía administrativa   •   </tspan><tspan fill="#b65a70" font-weight="700">1</tspan><tspan fill="#18352a"> mes   •   En cualquier momento</tspan></text>
<text x="48" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">(desde el día siguiente al silencio)   •   </tspan><tspan fill="#b65a70" font-weight="700">3 meses</tspan></text>
<text x="48" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">REPOSICIÓN   •   Ponen fin a la vía administrativa (Potestativo)   •   </tspan><tspan fill="#b65a70" font-weight="700">1</tspan><tspan fill="#18352a"> mes   •   En</tspan></text>
<text x="48" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">cualquier momento (desde el día siguiente al silencio)   •   </tspan><tspan fill="#b65a70" font-weight="700">1</tspan><tspan fill="#18352a"> mes</tspan></text>
<text x="48" y="364" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">EXTRAORDINARIO DE REVISIÓN   •   Actos firmes en vía administrativa (</tspan><tspan fill="#b65a70" font-weight="700">4</tspan><tspan fill="#18352a"> causas tasadas)</tspan></text>
<circle cx="55" cy="388" r="5" fill="#4d9670" />
<text x="73" y="395" font-family="Arial,sans-serif" font-size="17" fill="#18352a">•   4 años (error de hecho) / 3 meses (otras 3 causas)   •   —   •   3 meses</text>
<circle cx="55" cy="419" r="5" fill="#4d9670" />
<text x="73" y="426" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Truco de plazos de resolución: Alzada = 3 meses (tiene 3 sílabas: Al-za-da).</text>
<text x="48" y="457" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">Reposición = </tspan><tspan fill="#b65a70" font-weight="700">1</tspan><tspan fill="#18352a"> mes.</tspan></text>
<text x="42" y="535" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
