<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 527" role="img" aria-labelledby="title desc">
<title id="title">Instantánea 8: Plazos clave del Título III</title>
<desc id="desc">Infografía de repaso del tema 4, basada en Estatuto de Autonomía de la Comunitat Valenciana (LO 5/1982).</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#c47a32">TEMA 04 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#563915">Plazos clave del Título III</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Estatuto de Autonomía de la Comunitat Valenciana (LO 5/1982)</text>
<rect x="28" y="148" width="944" height="314" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="189" width="928" height="185" rx="10" fill="#fbf3e8" /><rect x="36" y="189" width="5" height="185" rx="2.5" fill="#c47a32" /><rect x="36" y="406" width="928" height="30" rx="10" fill="#f6e8d5" /><rect x="36" y="406" width="5" height="30" rx="2.5" fill="#c47a32" /><circle cx="55" cy="171" r="5" fill="#4d9670" />
<text x="73" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• 25 días: Plazo máximo tras las elecciones para constituir Les Corts (convocadas por el</text>
<text x="48" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a">President saliente).</text>
<circle cx="55" cy="233" r="5" fill="#4d9670" />
<text x="73" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• 48 horas: Tiempo que debe pasar entre la 1ª y la 2ª votación de investidura.</text>
<circle cx="55" cy="264" r="5" fill="#4d9670" />
<text x="73" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• 2 meses: Si pasan 2 meses desde la 1ª votación de investidura y nadie es elegido</text>
<text x="48" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a">President, se disuelven Les Corts y se convocan nuevas elecciones.</text>
<circle cx="55" cy="326" r="5" fill="#4d9670" />
<text x="73" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• 5 días: Plazo mínimo para votar una moción de censura desde que se presenta (en los 2</text>
<text x="48" y="364" font-family="Arial,sans-serif" font-size="17" fill="#18352a">primeros días se pueden presentar mociones alternativas).</text>
<circle cx="55" cy="388" r="5" fill="#4d9670" />
<text x="73" y="395" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• 15 días: Plazo para que el President promulgue las leyes de Les Corts (en nombre del</text>
<text x="48" y="426" font-family="Arial,sans-serif" font-size="17" fill="#18352a">Rey) desde su aprobación.</text>
<text x="42" y="504" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
<g aria-hidden="true"><circle cx="918" cy="80" r="34" fill="#ffffff" opacity="0.92" /><circle cx="918" cy="80" r="29" fill="#c47a32" opacity="0.16" /><path d="M891 73 L918 55 L945 73 Z" fill="#fff" stroke="#c47a32" stroke-width="3" stroke-linejoin="round" /><path d="M895 101 H941 M900 96 V77 M910 96 V77 M926 96 V77 M936 96 V77 M893 74 H943" fill="none" stroke="#c47a32" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /></g></svg>