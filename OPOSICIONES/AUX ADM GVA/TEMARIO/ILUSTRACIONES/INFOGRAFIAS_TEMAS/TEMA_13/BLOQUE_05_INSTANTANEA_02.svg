<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 806" role="img" aria-labelledby="title desc">
<title id="title">Instantánea 2: La Competencia y sus 5 "Traslados" (Arts. 8 a 14)</title>
<desc id="desc">Infografía de repaso del tema 13, basada en Régimen Jurídico del Sector Público (Ley 40/2015, de 1 de octubre).</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#386f8f">TEMA 13 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#143b52">La Competencia y sus 5 "Traslados" (Arts. 8 a 14)</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Régimen Jurídico del Sector Público (Ley 40/2015, de 1 de octubre)</text>
<rect x="28" y="148" width="944" height="593" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="158" width="928" height="92" rx="10" fill="#eaf3f8" /><rect x="36" y="158" width="5" height="92" rx="2.5" fill="#386f8f" /><rect x="36" y="251" width="928" height="92" rx="10" fill="#d7e8f1" /><rect x="36" y="251" width="5" height="92" rx="2.5" fill="#386f8f" /><rect x="36" y="344" width="928" height="92" rx="10" fill="#eaf3f8" /><rect x="36" y="344" width="5" height="92" rx="2.5" fill="#386f8f" /><rect x="36" y="437" width="928" height="92" rx="10" fill="#d7e8f1" /><rect x="36" y="437" width="5" height="92" rx="2.5" fill="#386f8f" /><rect x="36" y="530" width="928" height="92" rx="10" fill="#eaf3f8" /><rect x="36" y="530" width="5" height="92" rx="2.5" fill="#386f8f" /><rect x="36" y="623" width="928" height="92" rx="10" fill="#d7e8f1" /><rect x="36" y="623" width="5" height="92" rx="2.5" fill="#386f8f" /><text x="48" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#386f8f" font-weight="700">1</tspan><tspan fill="#18352a">. Delegación de competencias (Art. </tspan><tspan fill="#386f8f" font-weight="700">9</tspan><tspan fill="#18352a">): Se traslada el ejercicio de la competencia (no</tspan></text>
<text x="48" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a">la titularidad) a otros órganos de la misma Administración (aunque no sean</text>
<text x="48" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a">jerárquicamente dependientes) o a entidades vinculadas. Publicación: Obligatoria en el</text>
<text x="48" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a">Boletín Oficial correspondiente (BOE, DOGV...). No delegables: Relaciones con Jefatura</text>
<text x="48" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a">del Estado/Cortes, reglamentos, resolución de recursos en el órgano que dictó el acto</text>
<text x="48" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a">recurrido.</text>
<text x="48" y="364" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#386f8f" font-weight="700">2</tspan><tspan fill="#18352a">. Avocación (Art. </tspan><tspan fill="#386f8f" font-weight="700">10</tspan><tspan fill="#18352a">): Un órgano superior atrae para sí el conocimiento de un asunto</tspan></text>
<text x="48" y="395" font-family="Arial,sans-serif" font-size="17" fill="#18352a">cuya resolución corresponda a sus órganos dependientes. Recurso: Contra el acuerdo de</text>
<text x="48" y="426" font-family="Arial,sans-serif" font-size="17" fill="#18352a">avocación NO cabe recurso.</text>
<text x="48" y="457" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#386f8f" font-weight="700">3</tspan><tspan fill="#18352a">. Encomienda de gestión (Art. </tspan><tspan fill="#386f8f" font-weight="700">11</tspan><tspan fill="#18352a">): Se encarga a otro órgano o entidad la realización de</tspan></text>
<text x="48" y="488" font-family="Arial,sans-serif" font-size="17" fill="#18352a">actividades de carácter material o técnico (no supone cesión de titularidad).</text>
<text x="48" y="519" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#386f8f" font-weight="700">4</tspan><tspan fill="#18352a">. Delegación de firma (Art. </tspan><tspan fill="#386f8f" font-weight="700">12</tspan><tspan fill="#18352a">): Los titulares delegan la firma de sus resoluciones en</tspan></text>
<text x="48" y="550" font-family="Arial,sans-serif" font-size="17" fill="#18352a">titulares de órganos dependientes. NO necesita publicación para su validez.</text>
<text x="48" y="581" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#386f8f" font-weight="700">5</tspan><tspan fill="#18352a">. Suplencia (Art. </tspan><tspan fill="#386f8f" font-weight="700">13</tspan><tspan fill="#18352a">): Sustitución temporal del titular por vacante, ausencia o</tspan></text>
<text x="48" y="612" font-family="Arial,sans-serif" font-size="17" fill="#18352a">enfermedad (o abstención/recusación). No altera la competencia y NO necesita</text>
<text x="48" y="643" font-family="Arial,sans-serif" font-size="17" fill="#18352a">publicación.</text>
<circle cx="55" cy="667" r="5" fill="#4d9670" />
<text x="73" y="674" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Trampa mortal: Requieren publicación: Delegación de competencias y Encomienda de</text>
<text x="48" y="705" font-family="Arial,sans-serif" font-size="17" fill="#18352a">gestión. NO requieren publicación: Delegación de firma y Suplencia.</text>
<text x="42" y="783" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
