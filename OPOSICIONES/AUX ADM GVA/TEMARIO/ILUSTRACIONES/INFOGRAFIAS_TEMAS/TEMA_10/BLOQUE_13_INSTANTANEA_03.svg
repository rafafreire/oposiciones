<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 403" role="img" aria-labelledby="title desc">
<title id="title">Instantánea 3: Derechos y Obligaciones</title>
<desc id="desc">Infografía de repaso del tema 10, basada en Prevención de Riesgos Laborales (Ley 31/1995).</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#c47a32">TEMA 10 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#563915">Derechos y Obligaciones</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Prevención de Riesgos Laborales (Ley 31/1995)</text>
<rect x="28" y="148" width="944" height="190" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="220" width="928" height="92" rx="10" fill="#fbf3e8" /><rect x="36" y="220" width="5" height="92" rx="2.5" fill="#c47a32" /><circle cx="55" cy="171" r="5" fill="#4d9670" />
<text x="73" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Coste: Nunca recae sobre el trabajador.</text>
<circle cx="55" cy="202" r="5" fill="#4d9670" />
<text x="73" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Riesgo grave e inminente: Derecho a interrumpir actividad y abandonar el lugar de</text>
<text x="48" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a">trabajo.</text>
<circle cx="55" cy="264" r="5" fill="#4d9670" />
<text x="73" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Vigilancia de la salud (Art. 22): Voluntaria por regla general (obligatoria solo si es</text>
<text x="48" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a">imprescindible para evaluar efectos, peligro para sí/terceros o por ley).</text>
<text x="42" y="380" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
