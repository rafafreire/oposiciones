<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Instantánea 6: Fases del Procedimiento Administrativo (Arts. 54 a 95)</title>
<desc id="desc">Infografía de repaso del tema 12, basada en Procedimiento Administrativo Común (Ley 39/2015, de 1 de octubre).</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#b65a70">TEMA 12 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#512b35">Fases del Procedimiento Administrativo (Arts. 54 a 95)</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Procedimiento Administrativo Común (Ley 39/2015, de 1 de octubre)</text>
<rect x="28" y="148" width="944" height="407" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="158" width="928" height="92" rx="10" fill="#fbf0f2" /><rect x="36" y="158" width="5" height="92" rx="2.5" fill="#b65a70" /><rect x="36" y="251" width="928" height="185" rx="10" fill="#f5e2e7" /><rect x="36" y="251" width="5" height="185" rx="2.5" fill="#b65a70" /><rect x="36" y="468" width="928" height="61" rx="10" fill="#fbf0f2" /><rect x="36" y="468" width="5" height="61" rx="2.5" fill="#b65a70" /><text x="48" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#b65a70" font-weight="700">1</tspan><tspan fill="#18352a">. Iniciación: De oficio o a solicitud del interesado. (Subsanación de solicitud: </tspan><tspan fill="#b65a70" font-weight="700">10</tspan></text>
<text x="48" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">días, ampliables hasta </tspan><tspan fill="#b65a70" font-weight="700">5 días</tspan><tspan fill="#18352a"> más).</tspan></text>
<text x="48" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#b65a70" font-weight="700">2</tspan><tspan fill="#18352a">. Ordenación: Impulso de oficio y electrónico.</tspan></text>
<text x="48" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#b65a70" font-weight="700">3</tspan><tspan fill="#18352a">. Instrucción:</tspan></text>
<circle cx="55" cy="295" r="5" fill="#4d9670" />
<text x="73" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Alegaciones: En cualquier momento anterior al trámite de audiencia.</text>
<circle cx="55" cy="326" r="5" fill="#4d9670" />
<text x="73" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Informes: Plazo general de emisión 10 días. Salvo disposición expresa, son</text>
<text x="48" y="364" font-family="Arial,sans-serif" font-size="17" fill="#18352a">facultativos y no vinculantes.</text>
<circle cx="55" cy="388" r="5" fill="#4d9670" />
<text x="73" y="395" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Trámite de audiencia: Entre 10 y 15 días (justo antes de redactar la propuesta de</text>
<text x="48" y="426" font-family="Arial,sans-serif" font-size="17" fill="#18352a">resolución).</text>
<circle cx="55" cy="450" r="5" fill="#4d9670" />
<text x="73" y="457" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Información pública: Nunca inferior a 20 días.</text>
<text x="48" y="488" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#b65a70" font-weight="700">4</tspan><tspan fill="#18352a">. Finalización: Resolución, desistimiento, renuncia, caducidad (inactividad del</tspan></text>
<text x="48" y="519" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">interesado durante </tspan><tspan fill="#b65a70" font-weight="700">3 meses</tspan><tspan fill="#18352a"> tras advertencia) o imposibilidad material.</tspan></text>
<text x="42" y="597" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
