<title id="title">Instantánea 3: Límites al Derecho de Acceso (Art. 14 Ley 19/2013)</title>
<desc id="desc">Infografía de repaso del tema 9, basada en Transparencia y Buen Gobierno (Ley 19/2013 y Ley 1/2022 GVA).</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#7d63a8">TEMA 09 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#3c2f57">Límites al Derecho de Acceso (Art. 14 Ley 19/2013)</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Transparencia y Buen Gobierno (Ley 19/2013 y Ley 1/2022 GVA)</text>
<rect x="28" y="148" width="944" height="159" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="189" width="928" height="92" rx="10" fill="#f3eff8" /><rect x="36" y="189" width="5" height="92" rx="2.5" fill="#7d63a8" /><circle cx="55" cy="171" r="5" fill="#4d9670" />
<text x="73" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Se restringe por seguridad nacional, defensa, relaciones exteriores, prevención de</text>
<text x="48" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a">ilícitos, medio ambiente, secreto profesional o intereses económicos.</text>
<circle cx="55" cy="233" r="5" fill="#4d9670" />
<text x="73" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Datos personales: Los datos especialmente protegidos (salud, religión, ideología)</text>
<text x="48" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a">requieren consentimiento expreso y por escrito del afectado.</text>
<text x="42" y="349" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
