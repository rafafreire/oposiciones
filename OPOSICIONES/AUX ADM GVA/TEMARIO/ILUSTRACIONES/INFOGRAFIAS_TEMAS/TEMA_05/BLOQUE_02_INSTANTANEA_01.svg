<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 527" role="img" aria-labelledby="title desc">
<title id="title">Instantánea 1: Identificación y estructura de la Ley</title>
<desc id="desc">Infografía de repaso del tema 5, basada en Ley del Consell (Ley 5/1983, de 30 de diciembre).</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2"/>
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6"/>
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670"/>
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#43765a">TEMA 05 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#173b2b">Identificación y estructura de la Ley</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Ley del Consell (Ley 5/1983, de 30 de diciembre)</text>
<rect x="28" y="148" width="944" height="314" rx="16" fill="#ffffff" stroke="#d7e5d9"/>
<circle cx="55" cy="171" r="5" fill="#4d9670"/>
<text x="73" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• La norma: Ley 5/1983, de 30 de diciembre, del Consell.</text>
<circle cx="55" cy="202" r="5" fill="#4d9670"/>
<text x="73" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Estructura: Título Preliminar + 5 Títulos + 78 Artículos.</text>
<circle cx="55" cy="233" r="5" fill="#4d9670"/>
<text x="73" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Título Preliminar: Disposiciones Generales.</text>
<circle cx="55" cy="264" r="5" fill="#4d9670"/>
<text x="73" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Título I: El President de la Generalitat.</text>
<circle cx="55" cy="295" r="5" fill="#4d9670"/>
<text x="73" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Título II: El Consell.</text>
<circle cx="55" cy="326" r="5" fill="#4d9670"/>
<text x="73" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Título III: Relaciones del Consell con Les Corts.</text>
<circle cx="55" cy="357" r="5" fill="#4d9670"/>
<text x="73" y="364" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Título IV: De la Administración Pública de la Generalitat.</text>
<circle cx="55" cy="388" r="5" fill="#4d9670"/>
<text x="73" y="395" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Título V: Responsabilidad de los miembros del Consell y de la Administración.</text>
<circle cx="55" cy="419" r="5" fill="#4d9670"/>
<text x="73" y="426" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Truco: Recuerda 5/83 y 5 Títulos.</text>
<text x="42" y="504" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
</svg>