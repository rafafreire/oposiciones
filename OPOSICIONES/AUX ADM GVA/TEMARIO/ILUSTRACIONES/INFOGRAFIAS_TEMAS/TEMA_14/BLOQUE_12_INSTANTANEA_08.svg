<title id="title">Instantánea 8: Contratos Menores (Art. 118 Ley 9/2017 de Contratos del Sector Público — Exámenes GVA)</title>
<desc id="desc">Infografía de repaso del tema 14, basada en Hacienda Pública, Presupuestos y Contratación (Ley 1/2015 y Ley 9/2017).</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#4d9670">TEMA 14 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#173b2b">Contratos Menores (Art. 118 Ley 9/2017 de Contratos del Sector Público — Exámenes GVA)</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Hacienda Pública, Presupuestos y Contratación (Ley 1/2015 y Ley 9/2017)</text>
<rect x="28" y="148" width="944" height="283" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="282" width="928" height="123" rx="10" fill="#edf6ef" /><rect x="36" y="282" width="5" height="123" rx="2.5" fill="#4d9670" /><circle cx="55" cy="171" r="5" fill="#4d9670" />
<text x="73" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Cuantía máxima (IVA excluido):</text>
<circle cx="55" cy="202" r="5" fill="#4d9670" />
<text x="73" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Contratos de Obras: Valor estimado inferior a 40.000 euros.</text>
<circle cx="55" cy="233" r="5" fill="#4d9670" />
<text x="73" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Contratos de Suministros o Servicios: Valor estimado inferior a 15.000 euros.</text>
<circle cx="55" cy="264" r="5" fill="#4d9670" />
<text x="73" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Duración y prórroga: No pueden tener una duración superior a 1 año ni ser objeto de</text>
<text x="48" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a">prórroga.</text>
<circle cx="55" cy="326" r="5" fill="#4d9670" />
<text x="73" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Truco de examen: Fíjate en la palabra literal de la ley: "inferior a" (39.999,99 € en</text>
<text x="48" y="364" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">obras y </tspan><tspan fill="#4d9670" font-weight="700">14.999</tspan><tspan fill="#18352a">,</tspan><tspan fill="#4d9670" font-weight="700">99 €</tspan><tspan fill="#18352a"> en servicios/suministros). Si en el test pone "igual o inferior a</tspan></text>
<text x="48" y="395" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#4d9670" font-weight="700">40.000 €</tspan><tspan fill="#18352a">", es FALSA.</tspan></text>
<text x="42" y="473" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
