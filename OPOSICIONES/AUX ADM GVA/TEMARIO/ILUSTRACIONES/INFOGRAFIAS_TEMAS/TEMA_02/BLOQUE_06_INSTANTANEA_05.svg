<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 434" role="img" aria-labelledby="title desc">
<title id="title">Instantánea 5: Las Cortes Generales (Título III: Arts. 66 al 96)</title>
<desc id="desc">Infografía de repaso del tema 2, basada en Constitución Española de 1978.</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#4d9670">TEMA 02 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#173b2b">Las Cortes Generales (Título III: Arts. 66 al 96)</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Constitución Española de 1978</text>
<rect x="28" y="148" width="944" height="221" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="220" width="928" height="123" rx="10" fill="#edf6ef" /><rect x="36" y="220" width="5" height="123" rx="2.5" fill="#4d9670" /><circle cx="55" cy="171" r="5" fill="#4d9670" />
<text x="73" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Congreso: Mínimo 300 y máximo 400 diputados (actualmente 350). Mandato: 4 años.</text>
<circle cx="55" cy="202" r="5" fill="#4d9670" />
<text x="73" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Senado: 4 senadores por provincia peninsular (3 islas mayores, 1 islas menores, 2</text>
<text x="48" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">Ceuta, </tspan><tspan fill="#4d9670" font-weight="700">2</tspan><tspan fill="#18352a"> Melilla) + designados por CCAA (</tspan><tspan fill="#4d9670" font-weight="700">1</tspan><tspan fill="#18352a"> fijo + </tspan><tspan fill="#4d9670" font-weight="700">1</tspan><tspan fill="#18352a"> por cada millón de habitantes).</tspan></text>
<circle cx="55" cy="264" r="5" fill="#4d9670" />
<text x="73" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Periodos ordinarios de sesiones: De septiembre a diciembre y de febrero a junio.</text>
<circle cx="55" cy="295" r="5" fill="#4d9670" />
<text x="73" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Leyes Orgánicas (Art. 81): Derechos fundamentales, Estatutos, LOREG y demás previstas</text>
<text x="48" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a">en la CE. Requieren mayoría absoluta del Congreso en votación final sobre el conjunto.</text>
<text x="42" y="411" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
<g aria-hidden="true"><circle cx="918" cy="80" r="34" fill="#ffffff" opacity="0.92" /><circle cx="918" cy="80" r="29" fill="#4d9670" opacity="0.16" /><path d="M891 73 L918 55 L945 73 Z" fill="#fff" stroke="#4d9670" stroke-width="3" stroke-linejoin="round" /><path d="M895 101 H941 M900 96 V77 M910 96 V77 M926 96 V77 M936 96 V77 M893 74 H943" fill="none" stroke="#4d9670" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /></g></svg>