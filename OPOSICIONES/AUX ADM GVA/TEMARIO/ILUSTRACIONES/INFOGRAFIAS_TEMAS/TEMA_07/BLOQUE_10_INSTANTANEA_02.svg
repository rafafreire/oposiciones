<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 558" role="img" aria-labelledby="title desc">
<title id="title">Instantánea 2: Las 7 Instituciones Oficiales (Art. 13 TUE)</title>
<desc id="desc">Infografía de repaso del tema 7, basada en Unión Europea.</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#386f8f">TEMA 07 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#143b52">Las 7 Instituciones Oficiales (Art. 13 TUE)</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Unión Europea</text>
<rect x="28" y="148" width="944" height="345" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="158" width="928" height="92" rx="10" fill="#eaf3f8" /><rect x="36" y="158" width="5" height="92" rx="2.5" fill="#386f8f" /><rect x="36" y="251" width="928" height="92" rx="10" fill="#d7e8f1" /><rect x="36" y="251" width="5" height="92" rx="2.5" fill="#386f8f" /><rect x="36" y="344" width="928" height="92" rx="10" fill="#eaf3f8" /><rect x="36" y="344" width="5" height="92" rx="2.5" fill="#386f8f" /><text x="48" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#386f8f" font-weight="700">1</tspan><tspan fill="#18352a">. Parlamento Europeo: Representa a los ciudadanos (Estrasburgo, </tspan><tspan fill="#386f8f" font-weight="700">5 años</tspan><tspan fill="#18352a">).</tspan></text>
<text x="48" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#386f8f" font-weight="700">2</tspan><tspan fill="#18352a">. Consejo Europeo: Jefes de Estado/Gobierno, marca rumbo político, NO legisla</tspan></text>
<text x="48" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">(Presidente </tspan><tspan fill="#386f8f" font-weight="700">2,5 años</tspan><tspan fill="#18352a">).</tspan></text>
<text x="48" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#386f8f" font-weight="700">3</tspan><tspan fill="#18352a">. Consejo de la UE: Ministros nacionales, legisla junto al Parlamento (Presidencia</tspan></text>
<text x="48" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">rotatoria cada </tspan><tspan fill="#386f8f" font-weight="700">6 meses</tspan><tspan fill="#18352a">).</tspan></text>
<text x="48" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#386f8f" font-weight="700">4</tspan><tspan fill="#18352a">. Comisión Europea: Ejecutivo, monopolio de iniciativa legislativa (Bruselas, </tspan><tspan fill="#386f8f" font-weight="700">5 años</tspan><tspan fill="#18352a">).</tspan></text>
<text x="48" y="364" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#386f8f" font-weight="700">5</tspan><tspan fill="#18352a">. TJUE: Tribunal de Justicia (Luxemburgo, </tspan><tspan fill="#386f8f" font-weight="700">6 años</tspan><tspan fill="#18352a">).</tspan></text>
<text x="48" y="395" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#386f8f" font-weight="700">6</tspan><tspan fill="#18352a">. BCE: Banco Central Europeo (Fráncfort).</tspan></text>
<text x="48" y="426" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#386f8f" font-weight="700">7</tspan><tspan fill="#18352a">. Tribunal de Cuentas Europeo: Fiscaliza cuentas (Luxemburgo).</tspan></text>
<circle cx="55" cy="450" r="5" fill="#4d9670" />
<text x="73" y="457" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Trampa: El Consejo de Europa NO es una institución de la UE.</text>
<text x="42" y="535" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
