<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 682" role="img" aria-labelledby="title desc">
<title id="title">Instantánea 5: Nulidad de Pleno Derecho vs. Anulabilidad (Arts. 47 y 48)</title>
<desc id="desc">Infografía de repaso del tema 11, basada en Procedimiento Administrativo Común (Ley 39/2015, de 1 de octubre).</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#258b8b">TEMA 11 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#164847">Nulidad de Pleno Derecho vs. Anulabilidad (Arts. 47 y 48)</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Procedimiento Administrativo Común (Ley 39/2015, de 1 de octubre)</text>
<rect x="28" y="148" width="944" height="469" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="251" width="928" height="278" rx="10" fill="#e9f5f3" /><rect x="36" y="251" width="5" height="278" rx="2.5" fill="#258b8b" /><rect x="36" y="561" width="928" height="30" rx="10" fill="#d9eeeb" /><rect x="36" y="561" width="5" height="30" rx="2.5" fill="#258b8b" /><circle cx="55" cy="171" r="5" fill="#4d9670" />
<text x="73" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Nulidad de pleno derecho (Art. 47) — Los vicios más graves (no prescriben):</text>
<circle cx="55" cy="202" r="5" fill="#4d9670" />
<text x="73" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Lesionan derechos y libertades susceptibles de amparo constitucional.</text>
<circle cx="55" cy="233" r="5" fill="#4d9670" />
<text x="73" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Dictados por órgano manifiestamente incompetente por razón de la materia o del</text>
<text x="48" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a">territorio (¡Ojo! La incompetencia jerárquica NO es nulidad, es anulabilidad).</text>
<circle cx="55" cy="295" r="5" fill="#4d9670" />
<text x="73" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Tienen un contenido imposible.</text>
<circle cx="55" cy="326" r="5" fill="#4d9670" />
<text x="73" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Son constitutivos de infracción penal.</text>
<circle cx="55" cy="357" r="5" fill="#4d9670" />
<text x="73" y="364" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Prescinden total y absolutamente del procedimiento legalmente establecido.</text>
<circle cx="55" cy="388" r="5" fill="#4d9670" />
<text x="73" y="395" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Actos contrarios al ordenamiento por los que se adquieren facultades/derechos</text>
<text x="48" y="426" font-family="Arial,sans-serif" font-size="17" fill="#18352a">careciendo de los requisitos esenciales.</text>
<circle cx="55" cy="450" r="5" fill="#4d9670" />
<text x="73" y="457" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Anulabilidad (Art. 48) — La regla general:</text>
<circle cx="55" cy="481" r="5" fill="#4d9670" />
<text x="73" y="488" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Cualquier infracción del ordenamiento jurídico, incluida la desviación de poder y la</text>
<text x="48" y="519" font-family="Arial,sans-serif" font-size="17" fill="#18352a">incompetencia jerárquica.</text>
<circle cx="55" cy="543" r="5" fill="#4d9670" />
<text x="73" y="550" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• El defecto de forma solo hace anulable el acto si carece de los requisitos</text>
<text x="48" y="581" font-family="Arial,sans-serif" font-size="17" fill="#18352a">indispensables para alcanzar su fin o da lugar a indefensión.</text>
<text x="42" y="659" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
