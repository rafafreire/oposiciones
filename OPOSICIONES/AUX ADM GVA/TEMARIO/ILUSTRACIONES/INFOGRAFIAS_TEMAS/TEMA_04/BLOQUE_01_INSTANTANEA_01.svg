<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#c47a32">TEMA 04 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#563915">Datos básicos y estructura</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Estatuto de Autonomía de la Comunitat Valenciana (LO 5/1982)</text>
<rect x="28" y="148" width="944" height="190" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="220" width="928" height="92" rx="10" fill="#fbf3e8" /><rect x="36" y="220" width="5" height="92" rx="2.5" fill="#c47a32" /><circle cx="55" cy="171" r="5" fill="#4d9670" />
<text x="73" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• La norma: Ley Orgánica 5/1982, de 1 de julio (reforma clave: LO 1/2006).</text>
<circle cx="55" cy="202" r="5" fill="#4d9670" />
<text x="73" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Estructura: 10 Títulos, 81 Artículos, 4 Disposiciones Adicionales, 5 Transitorias, 1</text>
<text x="48" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">Derogatoria y </tspan><tspan fill="#c47a32" font-weight="700">1</tspan><tspan fill="#18352a"> Final.</tspan></text>
<circle cx="55" cy="264" r="5" fill="#4d9670" />
<text x="73" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Truco de examen: Asocia los números 5-82 y 10-81. Si te preguntan por el artículo</text>
<text x="48" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">final (Reforma del Estatuto), recuerda que es el último: el </tspan><tspan fill="#c47a32" font-weight="700">81</tspan><tspan fill="#18352a">.</tspan></text>
<text x="42" y="380" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
