<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#386f8f">TEMA 07 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#143b52">Derecho Derivado (Art. 288 TFUE)</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Unión Europea</text>
<rect x="28" y="148" width="944" height="283" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="158" width="928" height="92" rx="10" fill="#eaf3f8" /><rect x="36" y="158" width="5" height="92" rx="2.5" fill="#386f8f" /><rect x="36" y="251" width="928" height="92" rx="10" fill="#d7e8f1" /><rect x="36" y="251" width="5" height="92" rx="2.5" fill="#386f8f" /><rect x="36" y="344" width="928" height="61" rx="10" fill="#eaf3f8" /><rect x="36" y="344" width="5" height="61" rx="2.5" fill="#386f8f" /><text x="48" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a">Norma   •   ¿Obligatoria?   •   Características</text>
<text x="48" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a">REGLAMENTO   •   SÍ (en todo)   •   Alcance general y directamente aplicable (no</text>
<text x="48" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a">necesita transposición).</text>
<text x="48" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a">DIRECTIVA   •   SÍ (resultado)   •   Obliga en cuanto al resultado, deja libertad de</text>
<text x="48" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a">forma y medios (requiere transposición).</text>
<text x="48" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a">DECISIÓN   •   SÍ (en todo)   •   Solo obligatoria para sus destinatarios designados.</text>
<text x="48" y="364" font-family="Arial,sans-serif" font-size="17" fill="#18352a">RECOMENDACIÓN   •   NO   •   Sugiere línea de actuación.</text>
<text x="48" y="395" font-family="Arial,sans-serif" font-size="17" fill="#18352a">DICTAMEN   •   NO   •   Expresa una opinión.</text>
<text x="42" y="473" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
