<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 589" role="img" aria-labelledby="title desc">
<title id="title">Instantánea 1: Clases de Personal Empleado Público (Art. 15)</title>
<desc id="desc">Infografía de repaso del tema 15, basada en Ley de la Función Pública Valenciana (Ley 4/2021, de 16 de abril).</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#7d63a8">TEMA 15 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#3c2f57">Clases de Personal Empleado Público (Art. 15)</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Ley de la Función Pública Valenciana (Ley 4/2021, de 16 de abril)</text>
<rect x="28" y="148" width="944" height="376" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="158" width="928" height="92" rx="10" fill="#f3eff8" /><rect x="36" y="158" width="5" height="92" rx="2.5" fill="#7d63a8" /><rect x="36" y="251" width="928" height="92" rx="10" fill="#eae2f4" /><rect x="36" y="251" width="5" height="92" rx="2.5" fill="#7d63a8" /><rect x="36" y="344" width="928" height="92" rx="10" fill="#f3eff8" /><rect x="36" y="344" width="5" height="92" rx="2.5" fill="#7d63a8" /><rect x="36" y="468" width="928" height="30" rx="10" fill="#eae2f4" /><rect x="36" y="468" width="5" height="30" rx="2.5" fill="#7d63a8" /><text x="48" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#7d63a8" font-weight="700">1</tspan><tspan fill="#18352a">. Personal funcionario de carrera: Nombramiento legal, relación estatutaria, carácter</tspan></text>
<text x="48" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a">permanente.</text>
<text x="48" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#7d63a8" font-weight="700">2</tspan><tspan fill="#18352a">. Personal funcionario interino: Por razones expresamente justificadas de necesidad y</tspan></text>
<text x="48" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">urgencia (plazas vacantes, sustitución transitoria, programas temporales de máx. </tspan><tspan fill="#7d63a8" font-weight="700">3 años</tspan></text>
<text x="48" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">ampliables </tspan><tspan fill="#7d63a8" font-weight="700">12 meses</tspan><tspan fill="#18352a">, o exceso/acumulación de tareas de máx. </tspan><tspan fill="#7d63a8" font-weight="700">9 meses</tspan><tspan fill="#18352a"> en un periodo de</tspan></text>
<text x="48" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#7d63a8" font-weight="700">18</tspan><tspan fill="#18352a">).</tspan></text>
<text x="48" y="364" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#7d63a8" font-weight="700">3</tspan><tspan fill="#18352a">. Personal laboral: Contrato de trabajo (fijo, por tiempo indefinido o temporal).</tspan></text>
<text x="48" y="395" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#7d63a8" font-weight="700">4</tspan><tspan fill="#18352a">. Personal eventual: Nombramiento y cese libres (confianza o asesoramiento especial).</tspan></text>
<text x="48" y="426" font-family="Arial,sans-serif" font-size="17" fill="#18352a">Cesa automáticamente cuando cesa la autoridad a la que asesora.</text>
<circle cx="55" cy="450" r="5" fill="#4d9670" />
<text x="73" y="457" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Trampa de examen: La condición de personal eventual NO constituye mérito para el</text>
<text x="48" y="488" font-family="Arial,sans-serif" font-size="17" fill="#18352a">acceso a la función pública ni para la promoción interna.</text>
<text x="42" y="566" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
