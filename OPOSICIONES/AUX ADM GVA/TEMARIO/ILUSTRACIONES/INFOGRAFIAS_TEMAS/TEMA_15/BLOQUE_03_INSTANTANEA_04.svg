<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 713" role="img" aria-labelledby="title desc">
<title id="title">Instantánea 4: Adquisición y Pérdida de la condición de funcionario (Arts. 61 y 63)</title>
<desc id="desc">Infografía de repaso del tema 15, basada en Ley de la Función Pública Valenciana (Ley 4/2021, de 16 de abril).</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#7d63a8">TEMA 15 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#3c2f57">Adquisición y Pérdida de la condición de funcionario (Arts. 61 y 63)</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Ley de la Función Pública Valenciana (Ley 4/2021, de 16 de abril)</text>
<rect x="28" y="148" width="944" height="500" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="158" width="928" height="92" rx="10" fill="#f3eff8" /><rect x="36" y="158" width="5" height="92" rx="2.5" fill="#7d63a8" /><rect x="36" y="251" width="928" height="92" rx="10" fill="#eae2f4" /><rect x="36" y="251" width="5" height="92" rx="2.5" fill="#7d63a8" /><rect x="36" y="344" width="928" height="278" rx="10" fill="#f3eff8" /><rect x="36" y="344" width="5" height="278" rx="2.5" fill="#7d63a8" /><text x="48" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">¿Cómo se adquiere? (Deben cumplirse los </tspan><tspan fill="#7d63a8" font-weight="700">4</tspan><tspan fill="#18352a"> pasos en orden):</tspan></text>
<text x="48" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#7d63a8" font-weight="700">1</tspan><tspan fill="#18352a">. Superar el proceso selectivo.</tspan></text>
<text x="48" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#7d63a8" font-weight="700">2</tspan><tspan fill="#18352a">. Nombramiento por el órgano competente (publicado en el DOGV).</tspan></text>
<text x="48" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#7d63a8" font-weight="700">3</tspan><tspan fill="#18352a">. Acto de acatamiento de la Constitución, del Estatuto de Autonomía y del resto del</tspan></text>
<text x="48" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a">ordenamiento jurídico.</text>
<text x="48" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#7d63a8" font-weight="700">4</tspan><tspan fill="#18352a">. Toma de posesión dentro del plazo establecido.</tspan></text>
<text x="48" y="364" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">¿Cómo se pierde? (Las </tspan><tspan fill="#7d63a8" font-weight="700">5</tspan><tspan fill="#18352a"> causas):</tspan></text>
<circle cx="55" cy="388" r="5" fill="#4d9670" />
<text x="73" y="395" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Renuncia (por escrito y aceptada por la Administración).</text>
<circle cx="55" cy="419" r="5" fill="#4d9670" />
<text x="73" y="426" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Pérdida de la nacionalidad.</text>
<circle cx="55" cy="450" r="5" fill="#4d9670" />
<text x="73" y="457" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Jubilación total.</text>
<circle cx="55" cy="481" r="5" fill="#4d9670" />
<text x="73" y="488" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Sanción disciplinaria de separación del servicio (firme).</text>
<circle cx="55" cy="512" r="5" fill="#4d9670" />
<text x="73" y="519" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Pena principal o accesoria de inhabilitación absoluta o especial (firme).</text>
<circle cx="55" cy="543" r="5" fill="#4d9670" />
<text x="73" y="550" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Trampa clásica: La suspensión firme de funciones (sanción) NO hace perder la condición</text>
<text x="48" y="581" font-family="Arial,sans-serif" font-size="17" fill="#18352a">de funcionario, solo te deja en esa situación administrativa temporalmente. Solo la</text>
<text x="48" y="612" font-family="Arial,sans-serif" font-size="17" fill="#18352a">separación del servicio te expulsa definitivamente.</text>
<text x="42" y="690" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
<g aria-hidden="true"><circle cx="918" cy="80" r="34" fill="#ffffff" opacity="0.92" /><circle cx="918" cy="80" r="29" fill="#7d63a8" opacity="0.16" /><path d="M918 56 L941 65 V80 C941 94 931 103 918 109 C905 103 895 94 895 80 V65 Z" fill="#fff" stroke="#7d63a8" stroke-width="3" /><path d="M907 81 L915 89 L930 72" fill="none" stroke="#7d63a8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /></g></svg>