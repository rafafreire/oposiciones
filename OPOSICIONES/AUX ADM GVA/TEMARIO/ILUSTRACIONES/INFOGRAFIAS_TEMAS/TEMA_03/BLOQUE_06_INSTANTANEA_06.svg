<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 527" role="img" aria-labelledby="title desc">
<title id="title">Instantánea 6: El Gobierno y Control Parlamentario (Títulos IV y V)</title>
<desc id="desc">Infografía de repaso del tema 3, basada en Constitución Española de 1978.</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#7d63a8">TEMA 03 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#3c2f57">El Gobierno y Control Parlamentario (Títulos IV y V)</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Constitución Española de 1978</text>
<rect x="28" y="148" width="944" height="314" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="189" width="928" height="123" rx="10" fill="#f3eff8" /><rect x="36" y="189" width="5" height="123" rx="2.5" fill="#7d63a8" /><rect x="36" y="344" width="928" height="92" rx="10" fill="#eae2f4" /><rect x="36" y="344" width="5" height="92" rx="2.5" fill="#7d63a8" /><circle cx="55" cy="171" r="5" fill="#4d9670" />
<text x="73" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Investidura (Art. 99): 1ª votación = Mayoría absoluta; 2ª votación (48h después) =</text>
<text x="48" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">Mayoría simple. Si pasan </tspan><tspan fill="#7d63a8" font-weight="700">2 meses</tspan><tspan fill="#18352a"> desde la 1ª votación sin éxito, disolución y</tspan></text>
<text x="48" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a">elecciones.</text>
<circle cx="55" cy="264" r="5" fill="#4d9670" />
<text x="73" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Cuestión de confianza (Art. 112): La plantea el Presidente y se otorga por mayoría</text>
<text x="48" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a">simple.</text>
<circle cx="55" cy="326" r="5" fill="#4d9670" />
<text x="73" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Moción de censura (Art. 113): La proponen al menos 1/10 parte de los Diputados (con</text>
<text x="48" y="364" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">candidato alternativo), se vota pasados </tspan><tspan fill="#7d63a8" font-weight="700">5 días</tspan><tspan fill="#18352a"> y requiere mayoría absoluta.</tspan></text>
<circle cx="55" cy="388" r="5" fill="#4d9670" />
<text x="73" y="395" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Trampa comparativa: En el Congreso español firman 1/10; en Les Corts Valencianes</text>
<text x="48" y="426" font-family="Arial,sans-serif" font-size="17" fill="#18352a"><tspan fill="#18352a">firman </tspan><tspan fill="#7d63a8" font-weight="700">1</tspan><tspan fill="#18352a">/</tspan><tspan fill="#7d63a8" font-weight="700">5</tspan><tspan fill="#18352a">.</tspan></text>
<text x="42" y="504" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
<g aria-hidden="true"><circle cx="918" cy="80" r="34" fill="#ffffff" opacity="0.92" /><circle cx="918" cy="80" r="29" fill="#7d63a8" opacity="0.16" /><path d="M891 73 L918 55 L945 73 Z" fill="#fff" stroke="#7d63a8" stroke-width="3" stroke-linejoin="round" /><path d="M895 101 H941 M900 96 V77 M910 96 V77 M926 96 V77 M936 96 V77 M893 74 H943" fill="none" stroke="#7d63a8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /></g></svg>