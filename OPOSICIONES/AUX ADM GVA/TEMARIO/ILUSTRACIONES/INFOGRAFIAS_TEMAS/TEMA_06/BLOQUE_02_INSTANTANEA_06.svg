<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 496" role="img" aria-labelledby="title desc">
<title id="title">Instantánea 6: Nombramientos y Ceses (¿Quién nombra a quién?)</title>
<desc id="desc">Infografía de repaso del tema 6, basada en Ley del Consell (Ley 5/1983, de 30 de diciembre).</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#b65a70">TEMA 06 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#512b35">Nombramientos y Ceses (¿Quién nombra a quién?)</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Ley del Consell (Ley 5/1983, de 30 de diciembre)</text>
<rect x="28" y="148" width="944" height="283" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="220" width="928" height="154" rx="10" fill="#fbf0f2" /><rect x="36" y="220" width="5" height="154" rx="2.5" fill="#b65a70" /><rect x="36" y="375" width="928" height="30" rx="10" fill="#f5e2e7" /><rect x="36" y="375" width="5" height="30" rx="2.5" fill="#b65a70" /><circle cx="55" cy="171" r="5" fill="#4d9670" />
<text x="73" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Al President: Lo elige Les Corts y lo nombra el Rey (mediante Real Decreto).</text>
<circle cx="55" cy="202" r="5" fill="#4d9670" />
<text x="73" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• A los Vicepresidentes y Consellers: Los nombra y separa libremente el President</text>
<text x="48" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a">(mediante Decreto del President).</text>
<circle cx="55" cy="264" r="5" fill="#4d9670" />
<text x="73" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• A los Secretarios Autonómicos, Subsecretarios y Directores Generales: Los nombra y</text>
<text x="48" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a">cesa el Consell mediante Decreto del Consell, a propuesta del Conseller correspondiente.</text>
<circle cx="55" cy="326" r="5" fill="#4d9670" />
<text x="73" y="333" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Truco: Si es miembro del Consell (Conseller/Vicepresidente) -&gt; lo nombra el President.</text>
<text x="48" y="364" font-family="Arial,sans-serif" font-size="17" fill="#18352a">Si es alto cargo de la Administración (Sec. Autonómico, Subsecretario, Dir. General) -&gt;</text>
<text x="48" y="395" font-family="Arial,sans-serif" font-size="17" fill="#18352a">lo nombra el Consell (el equipo entero).</text>
<text x="42" y="473" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
<g aria-hidden="true"><circle cx="918" cy="80" r="34" fill="#ffffff" opacity="0.92" /><circle cx="918" cy="80" r="29" fill="#b65a70" opacity="0.16" /><path d="M891 73 L918 55 L945 73 Z" fill="#fff" stroke="#b65a70" stroke-width="3" stroke-linejoin="round" /><path d="M895 101 H941 M900 96 V77 M910 96 V77 M926 96 V77 M936 96 V77 M893 74 H943" fill="none" stroke="#b65a70" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /></g></svg>