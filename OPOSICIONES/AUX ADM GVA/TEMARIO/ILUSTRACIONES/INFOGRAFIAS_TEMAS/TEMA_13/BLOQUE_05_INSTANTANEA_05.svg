<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 403" role="img" aria-labelledby="title desc">
<title id="title">Instantánea 5: Potestad Sancionadora (Arts. 25 a 31)</title>
<desc id="desc">Infografía de repaso del tema 13, basada en Régimen Jurídico del Sector Público (Ley 40/2015, de 1 de octubre).</desc>
<rect width="1000" height="100%" rx="24" fill="#f3f7f2" />
<path d="M24 24h952a16 16 0 0 1 16 16v92H8V40A16 16 0 0 1 24 24Z" fill="#e3efe6" />
<rect x="0" y="24" width="10" height="108" rx="5" fill="#4d9670" />
<text x="42" y="61" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#386f8f">TEMA 13 · INFOGRAFÍA DE REPASO</text>
<text x="42" y="103" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#143b52">Potestad Sancionadora (Arts. 25 a 31)</text>
<text x="42" y="158" font-family="Arial,sans-serif" font-size="14" fill="#466052">Régimen Jurídico del Sector Público (Ley 40/2015, de 1 de octubre)</text>
<rect x="28" y="148" width="944" height="190" rx="16" fill="#ffffff" stroke="#d7e5d9" />
<rect x="36" y="189" width="928" height="30" rx="10" fill="#eaf3f8" /><rect x="36" y="189" width="5" height="30" rx="2.5" fill="#386f8f" /><circle cx="55" cy="171" r="5" fill="#4d9670" />
<text x="73" y="178" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Principios: Legalidad, Irretroactividad (salvo norma posterior más favorable),</text>
<text x="48" y="209" font-family="Arial,sans-serif" font-size="17" fill="#18352a">Tipicidad, Responsabilidad, Proporcionalidad y Non bis in idem.</text>
<circle cx="55" cy="233" r="5" fill="#4d9670" />
<text x="73" y="240" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Prescripción (si las leyes sectoriales no fijan otros plazos):</text>
<circle cx="55" cy="264" r="5" fill="#4d9670" />
<text x="73" y="271" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Infracciones: Muy graves a los 3 años, Graves a los 2 años, Leves a los 6 meses.</text>
<circle cx="55" cy="295" r="5" fill="#4d9670" />
<text x="73" y="302" font-family="Arial,sans-serif" font-size="17" fill="#18352a">• Sanciones: Muy graves a los 3 años, Graves a los 2 años, Leves al año.</text>
<text x="42" y="380" font-family="Arial,sans-serif" font-size="12" fill="#60766a">Auxiliar Administrativo GVA · Claves tomadas de la instantánea original</text>
